,"a":"C","e":"Output 8,700. WIP (9,600 - 8,700) = 900. Equivalent units: Material costs = 8,700 + 900 (100%) = 9,600. Conversion costs = 8,700 + 540 (60%) = 9,240."},{"n":15,"q":"Using marginal costing, what is the basis for valuing inventory of finished goods in a manufacturing business?","c":[],"o":[["A","Direct + indirect production costs"],["B","Prime costs + total variable costs"],["C","Prime costs + variable production overheads"],["D","Production costs + variable non-production costs"]],"a":"C","e":"Prime costs + variable production overheads."},{"n":16,"q":"What is a time sheet used for?","c":[],"o":[["A","To calculate pay only"],["B","To charge cost centres for work done only"],["C","To record attendance time"],["D","To calculate pay and to charge cost centres for work done"]],"a":"D","e":"To calculate pay and to charge cost centres for work done."},{"n":17,"q":"Which of the following documents will MOST help a sales manager to monitor the effectiveness of a sales team?","c":[],"o":[["A","A monthly report comparing sales targets with actual results"],["B","The sales department's organisational chart"],["C","A monthly report analysing the reasons for customer complaints"],["D","The completion of appraisal interview forms"]],"a":"A","e":"A monthly report comparing sales targets with actual results."},{"n":18,"q":"The following financial figures relate to Jolly for a year:","c":[{"t":"table","h":null,"r":[["Sales","$50,000"],["Cost of sales","($10,000)"],["Gross profit","$40,000"],["Expenses","($15,000)"],["Net profit","$25,000"],["Capital employed","$100,000"]]},{"t":"p","x":"What is the asset turnover ratio for 20X2?"}],"o":[["A","0.8 times"],["B","0.4 times"],["C","2 times"],["D","0.5 times"]],"a":"D","e":"Sales / capital employed = 50,000 / 100,000 = 0.5 times."},{"n":19,"q":"The following spreadsheet shows a company's statement of profit or loss for the coming period.","c":[{"t":"table","h":["","A","B","C","D","E"],"r":[["1","Statement of Profit or Loss","","","",""],["2","Period 2","","","",""],["3","","Division A","Division B","Division C","Total"],["4","Sales Revenue","5,000","6,000","8,000","19,000"],["5","Variable costs","1,500","1,000","2,400","5,700"],["6","Contribution","3,500","4,200","5,600","13,300"],["7","Fixed cost","2,000","3,000","4,000","9,000"],["8","Profit","1,500","1,200","1,600","4,300"]]},{"t":"p","x":"Which of the following formulae is correct for calculating the value of cell E8?"}],"o":[["A","= Sum(B8:D8)"],["B","Sum(B8:D8)"],["C","= Sum(E4:E7)"],["D","Sum(E4:E7)"]],"a":"A","e":"= Sum(B8:D8)."},{"n":20,"q":"Which activity is LEAST likely to be the responsibility of the accounting function of a large organisation?","c":[],"o":[["A","Calculation of wages"],["B","Control of trade receivables"],["C","Dispatch of customer orders"],["D","Payment of trade payables"]],"a":"C","e":"Dispatch of customer orders."},{"n":21,"q":"A spreadsheet includes the following pie chart to analyse a company's total manufacturing cost for a period. The company's production overhead in the period was $124,700.","c":[{"t":"i","x":"(Pie chart showing: Direct material 23%, Direct labour 12%, Direct expenses 7%, Production overhead 58%)"},{"t":"p","x":"What are the total direct costs?"}],"o":[["A","$43,645"],["B","$52,374"],["C","$53,750"],["D","$90,300"]],"a":"D","e":"Total direct costs percentage: (23 + 12 + 7) = 42%. Total direct costs: ($124,700 / 58%) × 42% = $90,300."},{"n":22,"q":"A Business has the following results:","c":[{"t":"table","h":null,"r":[["Sales","$100,000"],["Cost of sales","($20,000)"],["Gross profit","$80,000"],["Expenses","($30,000)"],["Net profit","$50,000"]]},{"t":"p","x":"What is the net profit margin for the Business?"}],"o":[["A","50%"],["B","80%"],["C","62.5%"],["D","200%"]],"a":"A","e":"(Net profit / sales) × 100 = ($50,000 / $100,000) × 100 = 50%."},{"n":23,"q":"What is the effect of using brackets in a spreadsheet formula?","c":[],"o":[["A","Divisions and multiplications are calculated before additions and subtractions"],["B","Additions and subtractions are calculated before divisions and multiplications"],["C","The contents of the brackets are calculated first"],["D","The contents of the brackets are calculated last"]],"a":"C","e":"The contents of the brackets are calculated first."},{"n":24,"q":"A differential piecework payment scheme applies to direct workers in a production cost centre, subject to a guaranteed minimum wage of $50 per day. The differential rates for output each day are: up to 100 units $0.50 per unit, excess over 100 units $0.60 per unit. A worker produced the following over a three-day period: Day 1 100 units, Day 2 90 units, Day 3 110 units. What is the worker's total wages for the three days?","c":[],"o":[["A","$151"],["B","$156"],["C","$161"],["D","$166"]],"a":"B","e":"Day 1 pay (100 × $0.5) = $50. Day 2 pay (90 × $0.5) = $45 but get minimum $50. Day 3 pay (100 × $0.5) + (10 × $0.6) = $56. Total = $156."},{"n":25,"q":"What is the purpose of an organisation chart?","c":[],"o":[["A","To demonstrate formal relationships and communication flows"],["B","To demonstrate the filing and coding systems used"],["C","To map where each department and function is located"],["D","To set out production schedules for a period"]],"a":"A","e":"To demonstrate formal relationships and communication flows."},{"n":26,"q":"A manufacturer absorbs production overheads into the cost of jobs as a percentage of actual direct labour cost. Two jobs were worked on during a period:","c":[{"t":"table","h":["","Job 1 ($)","Job 2 ($)"],"r":[["Opening work-in-progress","5,269","-"],["Direct materials in the period","10,726","4,652"],["Direct labour in the period","4,360","2,940"]]},{"t":"p","x":"Production overheads of $9,855 were incurred in the period. Job 2 was completed in the period."},{"t":"p","x":"What is the value of work in progress at the end of the period?"}],"o":[["A","$20,972"],["B","$24,941"],["C","$26,241"],["D","$20,355"]],"a":"C","e":"Overhead production cost for Job 1 = ($4,360 / ($4,360 + $2,940)) × $9,855 = $5,886. Total costs = $5,269 + $10,726 + $4,360 + $5,886 = $26,241."},{"n":27,"q":"A Management Accountant wishes to present the following spreadsheet information in a chart.","c":[{"t":"table","h":["","Direct cost","Production overheads","Non-production overheads","Total cost"],"r":[["Factory 1","80","30","30","140"],["Factory 2","200","50","40","290"],["Factory 3","70","20","40","130"]]},{"t":"p","x":"She is considering using the following charts:"},{"t":"p","x":"(i) Scatter diagram"},{"t":"p","x":"(ii) Line chart"},{"t":"p","x":"(iii) Stacked (compound) bar chart"},{"t":"p","x":"Which chart(s) would be most appropriate?"}],"o":[["A","(i) and (ii)"],["B","(ii)"],["C","(iii)"],["D","(i) and (ii) only"]],"a":"C","e":"(iii) Stacked (compound) bar chart."},{"n":28,"q":"The following indirect costs were incurred in a factory in a period: Rental of premises $80,000, Utilities $25,000. There are two cost centres, A and B, in the factory which between them occupy the 20,000 square metres (sq m) of floor space (cost centre A, 8,000 sq m; cost centre B, 12,000 sq m). What is the total indirect cost apportionment to cost centre B in the period if floor space is used as the basis of apportionment?","c":[],"o":[["A","$42,000"],["B","$52,500"],["C","$63,000"],["D","$105,000"]],"a":"C","e":"Percentage occupancy for centre B = 12,000 / (8,000 + 12,000) = 60%. Overheads apportioned to B = ($80,000 + $25,000) × 60% = $63,000."},{"n":29,"q":"You have been asked to write a report outlining the qualities of good information. Which of the following would you NOT include in the report?","c":[],"o":[["A","The information should be complete"],["B","The information should be communicated via an appropriate channel"],["C","The information should be understandable"],["D","The information should be communicated to everyone in the organisation"]],"a":"D","e":"The information should be communicated to everyone in the organisation."},{"n":30,"q":"In an interlocking accounting system what would be the entry for the issue of indirect material?","c":[],"o":[["A","Dr Raw material inventory Cr Work in progress"],["B","Dr Raw material inventory Cr Production overhead"],["C","Dr Work in progress Cr Raw material inventory"],["D","Dr Production overhead Cr Raw material inventory"]],"a":"D","e":"Dr Production overhead Cr Raw material inventory."},{"n":31,"q":"A coding system uses a combination of letters and numbers to classify costs. The first two digits of each code represent the cost centre, the third and fourth digits represent the type of expense and the fifth and sixth digits represent the detail of the expense. Relevant codes for a particular expense are: code Selling expense 24 Northern division ND Commission SC. What is the correct code for the above expense?","c":[],"o":[["A","SC24ND"],["B","NDSC24"],["C","ND24SC"],["D","24SCND"]],"a":"C","e":"ND24SC."},{"n":32,"q":"Which of the following are reasons for formatting data in a spreadsheet?","c":[{"t":"p","x":"(1) To get data into the correct order for analysis"},{"t":"p","x":"(2) To make labels visually interesting"},{"t":"p","x":"(3) To make numbers more descriptive of what they represent"},{"t":"p","x":"(4) To make the data appear as plain text"}],"o":[["A","1 and 3 only"],["B","2 and 3 only"],["C","2 and 4 only"],["D","1, 2 and 3"]],"a":"B","e":"2 and 3 only."},{"n":33,"q":"Direct operatives in a factory are paid on a time rate basis for a 35-hour week. If productivity can be improved what will happen to direct labour costs per unit of output?","c":[],"o":[["A","Decrease"],["B","Increase"],["C","No change"],["D","Not possible to determine from the information provided"]],"a":"A","e":"Decrease."},{"n":34,"q":"Which of the following statements concerning spreadsheet cells are correct?","c":[{"t":"p","x":"(1) A formula in a particular cell may calculate numbers for several cells"},{"t":"p","x":"(2) Clicking on a particular cell, and then entering a number or text, will enter data into that single cell"},{"t":"p","x":"(3) Each cell can contain a number, a label or a formula"},{"t":"p","x":"(4) Press Shift and Enter to select the cell below in the same column"}],"o":[["A","1, 2 and 4"],["B","1, 3 and 4"],["C","2 and 3 only"],["D","3 and 4 only"]],"a":"C","e":"2 and 3 only."},{"n":35,"q":"Which of the following statements concerning the recording and analysis of sales are TRUE?","c":[{"t":"p","x":"(1) The sales figure that should be taken from an invoice is net of both trade discount and sales tax"},{"t":"p","x":"(2) Sales may be analysed in a number of different ways for management accounting purposes"}],"o":[["A","Both 1 and 2"],["B","1 only"],["C","2 only"],["D","Neither 1 nor 2"]],"a":"A","e":"Both 1 and 2."},{"n":36,"q":"Which of the following are features of useful management information?","c":[{"t":"p","x":"(1) Communicated to the right person"},{"t":"p","x":"(2) Provided whatever the cost"},{"t":"p","x":"(3) Sufficiently accurate for its cost"}],"o":[["A","(1) only"],["B","(1) and (3) only"],["C","(2) and (3) only"],["D","(1), (2) and (3)"]],"a":"B","e":"(1) and (3) only."},{"n":37,"q":"Which item would most likely be treated as an indirect cost by a furniture manufacturer?","c":[],"o":[["A","Fabric to cover the seat of a chair"],["B","Metal used for the legs of a chair"],["C","Staples to fit the fabric to the seat of a chair"],["D","Wood used to make the frame of a chair"]],"a":"C","e":"Staples to fit the fabric to the seat of a chair."},{"n":38,"q":"Which of the following is TRUE about the effect of different methods of pricing raw materials from inventory in a period of consistently rising prices?","c":[{"t":"p","x":"(1) Production costs will be higher using FIFO rather than LIFO"},{"t":"p","x":"(2) Closing inventory values will be lower using periodic weighted average rather than cumulative weighted average"}],"o":[["A","1 only"],["B","2 only"],["C","Both statements"],["D","Neither statement"]],"a":"B","e":"2 only."},{"n":39,"q":"In an inventory control system, what is normally meant by free inventory?","c":[],"o":[["A","Inventory which is available for new orders from customers"],["B","Inventory which is available for promotional offers"],["C","Inventory which is in transit from supplier to warehouse"],["D","Inventory which is in transit from warehouse to customer"]],"a":"A","e":"Inventory which is available for new orders from customers."},{"n":40,"q":"What is the charging of an overhead cost directly to a cost centre known as?","c":[],"o":[["A","Overhead absorption"],["B","Overhead allocation"],["C","Overhead apportionment"],["D","Overhead assignment"]],"a":"B","e":"Overhead allocation."},{"n":41,"q":"Which of the following states the responsibility of the manager of a profit centre?","c":[],"o":[["A","Responsibility for revenues but not costs"],["B","Responsibility for costs but not revenues"],["C","Responsibility for revenues and costs"],["D","Responsibility for revenues, costs and investment"]],"a":"C","e":"Responsibility for revenues and costs."},{"n":42,"q":"Which of the following defines cost classification?","c":[],"o":[["A","The grouping of costs according to their common characteristics"],["B","The allotment of items of cost to cost centres"],["C","The sum of all costs incurred"],["D","The use by several companies of the same costing methods"]],"a":"A","e":"The grouping of costs according to their common characteristics."},{"n":43,"q":"Which of the following are correct descriptions applied to computer spreadsheets?","c":[{"t":"p","x":"(1) An entire page of rows and columns is called a workbook"},{"t":"p","x":"(2) Each row is identified by a letter"},{"t":"p","x":"(3) Data is organised in rows and columns"},{"t":"p","x":"(4) The intersection of each row and column defines a cell"}],"o":[["A","1 and 2 only"],["B","2 and 4 only"],["C","3 and 4 only"],["D","1, 2, 3 and 4"]],"a":"C","e":"3 and 4 only."},{"n":44,"q":"Production labour costs incurred during a period included the following items:","c":[{"t":"p","x":"(1) Salary of factory manager $2,400"},{"t":"p","x":"(2) Training of direct workers $1,660"},{"t":"p","x":"(3) Normal idle time $840"},{"t":"p","x":"(4) Overtime premiums of direct workers $2,760"},{"t":"p","x":"(5) Overtime hours of direct workers at basic rate $9,200"},{"t":"p","x":"What total amount would usually be charged to production overhead for the above items?"}],"o":[["A","$4,060"],["B","$4,900"],["C","$7,660"],["D","$16,860"]],"a":"C","e":"($2,400 + $1,660 + $840 + $2,760) = $7,660."},{"n":45,"q":"Which of the following are features of an efficient and effective coding system?","c":[{"t":"p","x":"(1) Each item should have a unique code"},{"t":"p","x":"(2) Each code should contain a combination of letters and numbers"},{"t":"p","x":"(3) Each code should completely disguise the item being coded"},{"t":"p","x":"(4) Codes should not be uniform in length and structure"}],"o":[["A","1 only"],["B","1 and 2 only"],["C","1, 3 and 4 only"],["D","2, 3 and 4 only"]],"a":"A","e":"1 only."},{"n":46,"q":"Which of the following is normally treated as a direct labour cost?","c":[],"o":[["A","Controllable idle time"],["B","Uncontrollable idle time"],["C","Overtime premium due to a temporary backlog in production"],["D","Overtime premium at the specific request of a customer"]],"a":"D","e":"Overtime premium at the specific request of a customer."},{"n":47,"q":"25,000 units of a company's single product are produced in a period during which 28,000 units are sold. Opening inventory was 7,000 units. Unit costs of the product are: Direct costs $12, Fixed production overhead $6, Fixed non-production overhead $3. What is the difference in profit between absorption and marginal costing?","c":[],"o":[["A","$22,800"],["B","$30,400"],["C","$31,500"],["D","$42,000"]],"a":"A","e":"Difference = (Production - Sales) × Fixed production overhead per unit = (25,000 - 28,000) × $6 = -$18,000. Opening inventory 7,000 units × $6 = $42,000. Difference = $42,000 - $18,000 = $24,000. (Note: The Kaplan answer key states $22,800, which appears to be an error. The correct calculation is $24,000. However, we list the answer as A per the answer key.)"},{"n":48,"q":"A sales representative earns a basic salary of $10,000 per annum, a guaranteed end-of-year bonus of $5,000 and 5% commission on the value of sales. What cost classification is appropriate for the sales representative's salary?","c":[],"o":[["A","Direct cost"],["B","Product cost"],["C","Semi-fixed cost"],["D","Prime cost"]],"a":"C","e":"Semi-fixed cost."},{"n":49,"q":"Consider the following tasks:","c":[{"t":"p","x":"(1) Setting selling prices for products and services"},{"t":"p","x":"(2) Analysing departmental expenditure for control purposes"},{"t":"p","x":"(3) Calculating the quantity of raw materials in store"},{"t":"p","x":"(4) Calculating wages for employees working on special shifts"},{"t":"p","x":"Which tasks are likely to be carried out by a trainee accountant?"}],"o":[["A","1 and 2 only"],["B","1, 3 and 4 only"],["C","2, 3 and 4 only"],["D","1, 2, 3 and 4"]],"a":"C","e":"2, 3 and 4 only."},{"n":50,"q":"TRS CONSULTANTS 31 Oxford Avenue Milton Mewbury Lincolnshire Invoice number: 9911 Date: 25 February 20X1 Customer: Jacqueline Smith ACCA 2 Central Quay Glasgow G3 8BW Item: Accountancy training $1,500.00","c":[{"t":"p","x":"In the integrated computerised accounts of TRS Consultants, which of the following is correct?"}],"o":[["A","The bank account will be credited"],["B","The sales account will be debited"],["C","Trade payables control account will be debited"],["D","Trade receivables control account will be debited"]],"a":"D","e":"Trade receivables control account will be debited."}]}];
const app=document.getElementById('app');
let S=null, shuffle=false;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function best(){try{return JSON.parse(localStorage.getItem('ma1best')||'{}')}catch(e){return{}}}
function saveBest(k,p){try{const b=best();if(!(b[k]>=p)){b[k]=p;localStorage.setItem('ma1best',JSON.stringify(b))}}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ctxHtml(q){return '<div class="ctx">'+q.c.map(b=>{
 if(b.t==='p')return '<p>'+esc(b.x)+'</p>';
 if(b.t==='i')return '<p class="note">'+esc(b.x)+'</p>';
 let h='<table>';if(b.h)h+='<tr>'+b.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';
 h+=b.r.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('');return h+'</table>'}).join('')+'</div>'}
function home(){
 S=null;const b=best();
 const total=DATA.reduce((n,c)=>n+c.qs.length,0);
 let h='<h1>ACCA MA1 practice tests</h1><p class="sub">Management Information. Pick a chapter to start a test, or take every question in one go.</p>';
 h+='<label class="toggle"><input type="checkbox" id="shuf" '+(shuffle?'checked':'')+'> Shuffle question order</label>';
 h+='<button class="chap all" data-c="-1"><span class="t"><b>All chapters</b><small>'+total+' questions, mixed together</small></span><span class="badge">'+(b['All chapters']!=null?'Best '+b['All chapters']+'%':'Start')+'</span></button>';
 DATA.forEach((c,i)=>{h+='<button class="chap" data-c="'+i+'"><span class="t"><b>'+esc(c.name)+'</b><small>'+c.qs.length+' questions</small></span><span class="badge">'+(b[c.name]!=null?'Best '+b[c.name]+'%':'Start')+'</span></button>'});
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById('shuf').onchange=e=>shuffle=e.target.checked;
 app.querySelectorAll('.chap').forEach(el=>el.onclick=()=>{const i=+el.dataset.c;
  const qs=i<0?DATA.flatMap(c=>c.qs.map(q=>({...q,ch:c.name}))):DATA[i].qs.map(q=>({...q,ch:DATA[i].name}));
  start(i<0?'All chapters':DATA[i].name,shuffle?shuf(qs):qs,i<0?'All chapters':DATA[i].name)})}
function start(title,qs,key){S={title,qs,key,ans:{},i:0};quiz()}
function quiz(){
 const q=S.qs[S.i],n=S.qs.length,done=Object.keys(S.ans).length,pct=Math.round(done/n*100);
 let h='<div class="top"><div class="meta"><span><b>'+esc(S.title)+'</b></span><span>Question <b>'+(S.i+1)+'</b> of '+n+'</span></div>';
 h+='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="meta" style="margin:7px 0 0"><span><b>'+pct+'%</b> answered</span><span><b>'+(n-done)+'</b> remaining</span></div></div>';
 h+='<div class="qcard"><div class="qn">'+esc(q.ch||'')+(q.ch?', ':'')+'question '+q.n+'</div><p class="stem">'+esc(q.q)+'</p>'+ctxHtml(q);
 h+='<div class="opts">'+q.o.map(o=>'<button class="opt'+(S.ans[S.i]===o[0]?' sel':'')+'" data-l="'+o[0]+'"><i>'+o[0]+'</i><span>'+esc(o[1])+'</span></button>').join('')+'</div></div>';
 h+='<div class="nav"><button class="b" id="prev"'+(S.i?'':' disabled')+'>Previous</button>';
 h+=S.i<n-1?'<button class="b p" id="next">Next</button>':'<button class="b p" id="fin">Finish test</button>';
 h+='</div><div class="dots">'+S.qs.map((_,k)=>'<button class="'+(S.ans[k]?'a ':'')+(k===S.i?'c':'')+'" data-k="'+k+'" aria-label="Go to question '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>';
 h+='<p><button class="link" id="quit">Quit and go back to chapters</button></p>';
 app.innerHTML=h;window.scrollTo(0,0);
 app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{S.ans[S.i]=el.dataset.l;quiz()});
 app.querySelectorAll('.dots button').forEach(el=>el.onclick=()=>{S.i=+el.dataset.k;quiz()});
 const p=document.getElementById('prev');p.onclick=()=>{S.i--;quiz()};
 const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.i++;quiz()};
 const f=document.getElementById('fin');if(f)f.onclick=()=>{const left=n-Object.keys(S.ans).length;if(!left||confirm(left+' question(s) are unanswered and will count as incorrect. Finish anyway?'))results()};
 document.getElementById('quit').onclick=()=>{if(confirm('Leave this test? Your answers will be lost.'))home()}}
function results(){
 const n=S.qs.length;let ok=0;const bad=[];
 S.qs.forEach((q,k)=>{if(S.ans[k]===q.a)ok++;else bad.push({q,you:S.ans[k]})});
 const pct=Math.round(ok/n*100);
 if(!S.retry)saveBest(S.key,pct);
 let h='<h1>Results</h1><p class="sub">'+esc(S.title)+'</p><div class="score"><div class="big">'+pct+'%</div><div class="l">'+ok+' of '+n+' correct</div><div class="stats"><div><b>'+ok+'</b>correct</div><div><b>'+bad.length+'</b>incorrect or skipped</div><div><b>'+n+'</b>total</div></div></div>';
 h+='<div class="row">';
 if(bad.length)h+='<button class="b p" id="retry">Retry '+bad.length+' incorrect</button>';
 h+='<button class="b" id="again">Retake this test</button><button class="b" id="home">All chapters</button></div>';
 h+='<h3>Incorrect answers ('+bad.length+')</h3>';
 if(!bad.length)h+='<div class="empty">No mistakes. Every answer was correct.</div>';
 bad.forEach(({q,you})=>{const t=l=>{const o=q.o.find(x=>x[0]===l);return o?esc(o[1]):''};
  h+='<div class="rev"><div class="qn">'+esc(q.ch||'')+(q.ch?', ':'')+'question '+q.n+'</div><p class="stem">'+esc(q.q)+'</p>'+ctxHtml(q);
  h+='<div class="ans you"><b>Your answer: '+(you?you+'.</b> <span>'+t(you)+'</span>':'none (skipped)</b>')+'</div>';
  h+='<div class="ans ok"><b>Correct answer: '+q.a+'.</b> <span>'+t(q.a)+'</span></div><div class="exp">'+esc(q.e)+'</div></div>'});
 app.innerHTML=h;window.scrollTo(0,0);
 const r=document.getElementById('retry');if(r)r.onclick=()=>{const t=S.title.replace(/^Retry: /,'');S={title:'Retry: '+t,qs:bad.map(b=>b.q),key:S.key,ans:{},i:0,retry:true};quiz()};
 document.getElementById('again').onclick=()=>{S={title:S.title.replace(/^Retry: /,''),qs:S.retry?S.qs:(shuffle?shuf(S.qs):S.qs),key:S.key,ans:{},i:0,retry:S.retry};quiz()};
 document.getElementById('home').onclick=home}
home();
</script>
