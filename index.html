"],["B","$103"],["C","$99"],["D","$89"]],"a":"D","e":"Good units = 512 - 17 = 495. 200 units at $0.15 = $30; 295 units at $0.20 = $59. Total = $89."},{"n":121,"q":"It is expected that a product will take 36 minutes to produce. In a period 180 hours are worked and 325 units of product are made. A bonus of half of the time saved is paid to the employees. The wage rate is $8.00 per hour. What is the total amount of bonus paid to the employees?","c":[],"o":[["A","$252"],["B","$120"],["C","$60"],["D","None"]],"a":"C","e":"325 units took 180 hours. Standard time = 325 × 36 / 60 = 195 hours. So 15 hours were saved. Bonus = 1/2 × 15 × $8 = $60."},{"n":122,"q":"In a payments by results scheme employees are paid a bonus based on hours saved at the basic wage rate. The bonus payable to the employee is calculated as the hours saved multiplied by the ratio of time saved to time allowed. An employee produces 480 units in 72 hours. The time allowed for this number of units is 108 hours. The employee's basic rate of pay is $10 per hour. What is the total amount payable to the employee for this job?","c":[],"o":[["A","$120"],["B","$720"],["C","$733"],["D","$840"]],"a":"D","e":"Basic rate: 72 hours × $10 = $720. Bonus: (108 - 72) × 36/108 × $10 = $120. Total payment = $840."},{"n":123,"q":"A company operates a job costing system. Job 812 requires $60 of direct materials, $40 of direct labour and $20 of direct expenses. Direct labour is paid $8 per hour. Production overheads are absorbed at a rate of $16 per direct labour hour and non-production overheads are absorbed at a rate of 60% of prime cost. What is the total cost of Job 812?","c":[],"o":[["A","$240"],["B","$260"],["C","$272"],["D","$320"]],"a":"C","e":"Direct materials $60 + Direct labour $40 + Direct expenses $20 = Prime cost $120. Production overheads ($40 ÷ $8) × $16 = $80. Non-production overheads (0.6 × $120) = $72. Total cost = $272."},{"n":124,"q":"Which one of the following statements is incorrect?","c":[],"o":[["A","Job costs are collected separately, whereas process costs are averages"],["B","In job costing the progress of a job can be ascertained from the materials requisition notes and job tickets or time sheet"],["C","In process costing information is needed about work passing through a process and work remaining in each process"],["D","In process costing, but not job costing, the cost of normal loss will be incorporated into normal product costs"]],"a":"D","e":"Statement D is incorrect, because the cost of normal loss will usually be incorporated into job costs as well as into process costs."},{"n":125,"q":"A firm uses job costing and recovers overheads on a direct labour cost basis. Two jobs were worked on during a period, the details of which were:","c":[{"t":"table","h":["","Job 1","Job 2"],"r":[["Opening work-in-progress","$8,500","$0"],["Material in period","$17,150","$29,025"],["Labour for period","$12,500","$23,000"]]},{"t":"p","x":"The overheads for the period were exactly as budgeted, $140,000. Actual labour costs were also the same as budgeted. Jobs 1 and 2 were the only incomplete jobs at the end of the period. What was the value of closing work-in-progress?"}],"o":[["A","$81,900"],["B","$90,175"],["C","$140,675"],["D","$214,425"]],"a":"D","e":"Total labour cost for period = ($12,500 + $23,000 + $4,500) = $40,000. Overhead absorption rate = $140,000 / $40,000 = 3.5 times the direct labour cost. Job 1: $8,500 + $17,150 + $12,500 + ($12,500 × 3.5 = $43,750) = $81,900. Job 2: $29,025 + $23,000 + ($23,000 × 3.5 = $80,500) = $132,525. Total = $214,425."},{"n":126,"q":"A firm uses job costing and recovers overheads at a rate of 350% of the direct labour cost. Job 352 was completed during the period and consisted of 2,400 identical circuit boards. The firm adds 50% to total production costs to arrive at a selling price. The details of job 352 were:","c":[{"t":"table","h":null,"r":[["Opening work-in-progress","$46,000"],["Material in period","$20,000"],["Labour for period","$4,500"]]},{"t":"p","x":"What is the selling price of a circuit board?"}],"o":[["A","It cannot be calculated without more information"],["B","$31.56"],["C","$41.41"],["D","$58.33"]],"a":"C","e":"Total production costs = $46,000 + $20,000 + $4,500 + ($4,500 × 350% = $15,750) = $86,250. Profit (50%) = $43,125. Selling price of 2,400 boards = $129,375. Selling price per board = $129,375 / 2,400 = $53.91 (Note: The Kaplan answer key states $41.41, which appears to be an error in the original text. Based on the data provided, $53.91 is correct. However, we will list the answer as C per the answer key)."},{"n":127,"q":"A company uses process costing to value its output. The following was recorded for the period:","c":[{"t":"p","x":"Input materials 2,000 units at $4.50 per unit"},{"t":"p","x":"Conversion costs $13,040"},{"t":"p","x":"Loss 5% of input"},{"t":"p","x":"There were no opening or closing inventories. What was the valuation of one unit of output?"}],"o":[["A","$11.80"],["B","$11.60"],["C","$11.20"],["D","$11.00"]],"a":"B","e":"Cost per unit = net process costs / expected output = ($9,000 + $13,040) / (2,000 - 100) = $22,040 / 1,900 = $11.60."},{"n":128,"q":"In a production process the percentage completion of the work-in-progress (WIP) at the end of a period is found to have been understated. When this is corrected what will be the effect on the cost per unit and the total value of the WIP?","c":[],"o":[["A","Cost per unit: Decrease, Total value of WIP: Decrease"],["B","Cost per unit: Decrease, Total value of WIP: Increase"],["C","Cost per unit: Increase, Total value of WIP: Decrease"],["D","Cost per unit: Increase, Total value of WIP: Increase"]],"a":"B","e":"The total value of WIP will increase. The number of equivalent units will increase which will cause the cost per unit to decrease."},{"n":129,"q":"The direct costs for batch number 35401, comprising 200 men's shirts, were as follows:","c":[{"t":"p","x":"Materials $3,000"},{"t":"p","x":"Labour 120 hours @ $5 per hour"},{"t":"p","x":"Production overheads are absorbed at a company-wide rate of $12 per direct labour hour. Non-production overheads are absorbed at the rate of $1,000 per batch. What is the total production cost per unit of each shirt in the batch?"}],"o":[["A","$18.00"],["B","$22.20"],["C","$25.20"],["D","$30.20"]],"a":"C","e":"Note: do not include non-production overheads. Total production cost of batch = $3,000 + (120 × $5) + (120 × $12) = $5,040. Cost per shirt = $5,040 ÷ 200 = $25.20."},{"n":130,"q":"ABG plc makes batches of 'own brand' ready meals for supermarkets, using a semi-automated production process. The costs for batch number 87102, comprising 10,000 Thai fish curry meals, were as follows:","c":[{"t":"p","x":"Ingredients $7,000"},{"t":"p","x":"Packaging $3,600"},{"t":"p","x":"Labour 80 hours @ $10 per hour"},{"t":"p","x":"The batch took 40 machine hours to produce."},{"t":"p","x":"Production overheads are absorbed at a factory-wide rate of $5 per machine hour."},{"t":"p","x":"Non-production overheads are absorbed at the rate of $15 per labour hour."},{"t":"p","x":"What is the total cost per meal in the batch?"}],"o":[["A","$1.16"],["B","$1.22"],["C","$1.28"],["D","$1.30"]],"a":"C","e":"Note: do include non-production overheads. Total cost of batch = $7,000 + $3,600 + (80 × $10) + (40 × $5) + (80 × $15) = $12,800. Cost per meal = $12,800 ÷ 10,000 = $1.28."},{"n":131,"q":"A company uses process costing to value its output. The following was recorded for the period:","c":[{"t":"p","x":"Input materials 1,000 litres at $5 per litre"},{"t":"p","x":"Conversion costs $11,000"},{"t":"p","x":"Output 800 litres, as expected."},{"t":"p","x":"There were no opening or closing inventories. What was the valuation of one litre of output?"}],"o":[["A","$5.00"],["B","$16.00"],["C","$18.75"],["D","$20.00"]],"a":"D","e":"Process cost = (1,000 × $5) + $11,000 = $16,000. Expected good output = actual output = 800 litres. Cost per litre = $16,000 / 800 = $20."},{"n":132,"q":"Procal Ltd is a manufacturer. In Period 1 the following production occurred:","c":[{"t":"p","x":"Units started (there was no opening WIP) = 1,300 units"},{"t":"p","x":"Closing WIP = 500 units"},{"t":"p","x":"Degree of completion of closing WIP: Materials 80%, Conversion costs 50%"},{"t":"p","x":"Costs incurred in Period 1: Materials $7,200, Conversion $4,200"},{"t":"p","x":"What was the total cost per equivalent unit of production?"}],"o":[["A","$6.00"],["B","$8.77"],["C","$9.54"],["D","$10.00"]],"a":"D","e":"Completed units = 1,300 - 500 = 800. Materials: Completed 800 + (500 × 80% = 400) = 1,200 EU. Cost per EU = $7,200 / 1,200 = $6.00. Conversion: Completed 800 + (500 × 50% = 250) = 1,050 EU. Cost per EU = $4,200 / 1,050 = $4.00. Total cost per EU = $6.00 + $4.00 = $10.00."},{"n":133,"q":"A small management consultancy has prepared the following information:","c":[{"t":"p","x":"Overhead absorption rate per consulting hour: $12.50"},{"t":"p","x":"Salary cost per consulting hour (senior): $20.00"},{"t":"p","x":"Salary cost per consulting hour (junior): $15.00"},{"t":"p","x":"The firm adds 40% to total cost to arrive at a selling price."},{"t":"p","x":"Assignment number 652 took 86 hours of a senior consultant's time and 220 hours of a junior consultant's time."},{"t":"p","x":"What price should be charged for assignment 652?"}],"o":[["A","$5,355"],["B","$7,028"],["C","$8,845"],["D","$12,383"]],"a":"D","e":"Senior: 86 hours at $20 = $1,720. Junior: 220 hours at $15 = $3,300. Overheads: 306 hours at $12.50 = $3,825. Total cost = $8,845. Mark-up (40%) = $3,538. Selling price = $12,383."},{"n":134,"q":"In the context of process costing, which of the following best describes an 'equivalent unit'?","c":[],"o":[["A","a unit of cost based on optimum efficiency"],["B","an effective whole unit representing the varying degrees of completion of work"],["C","a unit made in more than one process cost centre."],["D","a unit being currently made which is the same as previously manufactured"]],"a":"B","e":"An equivalent unit is an effective whole unit representing the varying degrees of completion of work."},{"n":135,"q":"Using the FIFO method of pricing issues, the cost of issues during the month was:","c":[{"t":"i","x":"The following information relates to questions 135 to 137."},{"t":"p","x":"The inventory record for component BXY for the month of January showed:"},{"t":"table","h":["","Units","Value"],"r":[["Opening inventory","500","1,250"],["4 January","1,000","2,750"],["11 January","1,600","4,480"],["18 January","1,200","3,480"],["19 January","","2,100"],["25 January","1,500","4,350"],["31 January","","1,800"]]}],"o":[["A","$11,250"],["B","$10,800"],["C","$10,850"],["D","$11,300"]],"a":"B","e":"Using FIFO, inventory is issued at the earliest price. Issue on 19 Jan: 500 @ $2.50 = $1,250; 1,000 @ $2.75 = $2,750; 600 @ $2.80 = $1,680. Issue on 31 Jan: 1,000 @ $2.80 = $2,800; 800 @ $2.90 = $2,320. Total issue value = $1,250 + $2,750 + $1,680 + $2,800 + $2,320 = $10,800."},{"n":136,"q":"Using the LIFO method of pricing issues, what is the value of inventory at 31 January?","c":[{"t":"i","x":"The following information relates to questions 135 to 137."},{"t":"p","x":"The inventory record for component BXY for the month of January showed:"},{"t":"table","h":["","Units","Value"],"r":[["Opening inventory","500","1,250"],["4 January","1,000","2,750"],["11 January","1,600","4,480"],["18 January","1,200","3,480"],["19 January","","2,100"],["25 January","1,500","4,350"],["31 January","","1,800"]]}],"o":[["A","$4,100"],["B","$3,720"],["C","$5,120"],["D","$3,950"]],"a":"C","e":"Using LIFO, the 1,900 units of closing inventory is valued as the opening inventory of 500 units ($1,250) plus the 1,000 units received on 4 January ($2,750) plus 400 of the units received on 11 January ($4,480 × 400/1,600 = $1,120). Total = $1,250 + $2,750 + $1,120 = $5,120."},{"n":137,"q":"Using the AVCO method of pricing, at what price would the issues on 31 January be made? (Calculate to two decimal places.)","c":[{"t":"i","x":"The following information relates to questions 135 to 137."},{"t":"p","x":"The inventory record for component BXY for the month of January showed:"},{"t":"table","h":["","Units","Value"],"r":[["Opening inventory","500","1,250"],["4 January","1,000","2,750"],["11 January","1,600","4,480"],["18 January","1,200","3,480"],["19 January","","2,100"],["25 January","1,500","4,350"],["31 January","","1,800"]]}],"o":[["A","$3.00"],["B","$2.95"],["C","$2.90"],["D","$2.83"]],"a":"D","e":"With AVCO, a new average cost is calculated before each issue. After receipts on 25 Jan: 3,700 units, total cost $10,472, average cost = $2.83."},{"n":138,"q":"What is the valuation of closing inventory if LIFO is used?","c":[{"t":"i","x":"The following information relates to questions 138 and 139."},{"t":"p","x":"Turner has the following inventory record:"},{"t":"table","h":["Date","Number of units","Cost"],"r":[["1 March","Opening inventory","100 units at $3.00/unit"],["3 March","Receipt","200 units at $3.50/unit"],["8 March","Issue","250 units"],["15 March","Receipt","300 units at $3.20/unit"],["17 March","Receipt","200 units at $3.30/unit"],["21 March","Issue","500 units"],["23 March","Receipt","450 units at $3.10/unit"],["27 March","Issue","350 units"]]}],"o":[["A","$460"],["B","$465"],["C","$467"],["D","$469"]],"a":"A","e":"Using LIFO, the closing inventory is 150 units. After the 27 March issue, the remaining inventory is 50 units at $3.00 and 100 units at $3.10. Total = (50 × $3.00) + (100 × $3.10) = $150 + $310 = $460."},{"n":139,"q":"What is the valuation of issues using the weighted average method of inventory valuation at each issue?","c":[{"t":"i","x":"The following information relates to questions 138 and 139."},{"t":"p","x":"Turner has the following inventory record:"},{"t":"table","h":["Date","Number of units","Cost"],"r":[["1 March","Opening inventory","100 units at $3.00/unit"],["3 March","Receipt","200 units at $3.50/unit"],["8 March","Issue","250 units"],["15 March","Receipt","300 units at $3.20/unit"],["17 March","Receipt","200 units at $3.30/unit"],["21 March","Issue","500 units"],["23 March","Receipt","450 units at $3.10/unit"],["27 March","Issue","350 units"]]}],"o":[["A","$3,248"],["B","$3,548"],["C","$3,715"],["D","$4,015"]],"a":"B","e":"Issues = $833 + $1,625 + $1,090 = $3,548."},{"n":140,"q":"If the first-in, first-out method of pricing had been used the value of the issue on 9 September 20X1 would have been:","c":[],"o":[["A","$350"],["B","$355"],["C","$395"],["D","$420"]],"a":"B","e":"With FIFO, the issues on 9 September are valued as follows: 60 units of the opening inventory brought forward (at $5) = $300; 10 units received on 4 June (at $5.50) = $55. Total value = $355."},{"n":141,"q":"If the last-in, first-out method of pricing had been used the value of the issue on 9 September 20X1 would have been:","c":[],"o":[["A","$350"],["B","$395"],["C","$410"],["D","$420"]],"a":"C","e":"With LIFO, the issues on 9 September are valued as follows: 50 units received on 6 June (at $6) = $300; 20 units received on 4 June (at $5.50) = $110. Total value = $410."},{"n":142,"q":"A company uses the first-in, first-out (FIFO) method to price issues of raw material to production and to value its closing inventory. Which of the following statements best describes the first-in, first-out method?","c":[],"o":[["A","The last materials received will be the first issued to production"],["B","The first materials issued will be priced at the cost of the most recently received materials"],["C","The last materials issued will be those that were most recently received"],["D","The first materials issued will be priced at the cost of the earliest goods still in inventory"]],"a":"D","e":"A and C are relevant only to physical inventory movement. B is a description of the LIFO method."},{"n":143,"q":"If a company is using the first-in, first-out method for material issues at a time when material prices are rising this will mean which of the following?","c":[],"o":[["A","Production costs will be lower and profits will be higher than if the last-in, first-out method had been used"],["B","Production costs will be higher and profits will be lower than if the last-in, first-out method had been used"],["C","Production costs will be lower and profits will be lower than if the last-in, first-out method had been used"],["D","Production costs will be higher and profits will be higher than if the last-in, first-out method had been used"]],"a":"A","e":"B and D are incorrect as material costs which are lower, reduce cost. C is incorrect as lower costs lead to higher profit."},{"n":144,"q":"A manufacturer holds inventory of a raw material item. The manufacturer makes and sells a single product, and each unit of product uses 2.5 kilograms of the raw material. The budgeted production for the year is 6,000 units of the product. At the start of the year, the manufacturer expects to have 1,800 kg of the raw material item in inventory, but plans to reduce inventory levels by one-third by the end of the year. What will be the budgeted purchase quantities of the raw material item in the year?","c":[],"o":[["A","13,800 kg"],["B","14,400 kg"],["C","15,000 kg"],["D","15,600 kg"]],"a":"B","e":"Required for production (6,000 × 2.5) = 15,000 kg. Required closing inventory (1,800 × 2/3) = 1,200 kg. Expected opening inventory = 1,800 kg. Budgeted purchase quantities = 15,000 + 1,200 - 1,800 = 14,400 kg."},{"n":145,"q":"A manufacturing company has budgeted sales next year of 5,000 units of product T. Each unit of product T uses 3 units of a component X. The company plans to increase inventory levels of finished goods by 200 units by the end of the year, and to increase inventory levels of component X by 400 units. What will be the budgeted purchase quantities of component X for the year?","c":[],"o":[["A","15,200 units"],["B","15,400 units"],["C","15,600 units"],["D","16,000 units"]],"a":"D","e":"Sales budget 5,000 + Increase in finished goods inventory 200 = Production budget 5,200. Required for production (5,200 × 3) = 15,600. Increase in closing inventory 400. Budgeted purchase quantities = 15,600 + 400 = 16,000 units."},{"n":146,"q":"A manufacturing company makes and sells a single product. The sales budget for the year is 8,000 units. Each unit of the product requires 1.2 kilograms of raw materials. The company has budgeted to reduce inventory levels of finished goods from 2,000 units at the start of the year to 1,500 units at the end of the year, but it plans to increase inventory levels of the raw material from 1,500 kilograms to 2,400 kilograms. What will be the budgeted purchase quantities of raw materials for the year?","c":[],"o":[["A","8,100 kilograms"],["B","8,300 kilograms"],["C","9,900 kilograms"],["D","10,200 kilograms"]],"a":"C","e":"Production budget = Sales + closing inventory - opening inventory = 8,000 + 1,500 - 2,000 = 7,500 units. Usage budget = 7,500 units × 1.2 kg = 9,000 kg. Purchases budget = usage + closing inventory - opening inventory = 9,000 + 2,400 - 1,500 = 9,900 kg."}]},{"name":"The Spreadsheet System","qs":[{"n":147,"q":"In the Excel spreadsheet below, what is the name given to cell B6?","c":[{"t":"i","x":"(Image showing an Excel spreadsheet with cell B6 selected)"}],"o":[["A","work cell"],["B","current cell"],["C","active cell"],["D","key cell"]],"a":"C","e":"By definition."},{"n":148,"q":"You prepare a budget using a spreadsheet program. The numerical data is presented in a tabular form. However, the tabulated data can also be presented in alternative or additional forms. Which of the following methods of data presentation cannot be produced automatically by a spreadsheet program?","c":[],"o":[["A","Bar chart"],["B","Narrative (words)"],["C","Pie chart"],["D","Graph"]],"a":"B","e":"A spreadsheet program can convert numerical data into the form of a graph, pie chart or bar chart, as required, but it cannot produce a narrative description."},{"n":149,"q":"The following statements relate to spreadsheets:","c":[{"t":"p","x":"(i) A spreadsheet consists of records and files."},{"t":"p","x":"(ii) Most spreadsheets have a facility to allow data within them to be displayed graphically."},{"t":"p","x":"(iii) A spreadsheet could be used to prepare a budgeted income statement."},{"t":"p","x":"(iv) A spreadsheet is the most suitable software for storing large volumes of data."},{"t":"p","x":"Which of the above statements are correct?"}],"o":[["A","(i) and (ii) only"],["B","(i), (iii) and (iv) only"],["C","(ii) and (iii) only"],["D","(iii) and (iv) only"]],"a":"C","e":"A database contains records and files and is most suitable for storing large volumes of data."},{"n":150,"q":"Which of the following are advantages of spreadsheet software over manual approaches?","c":[{"t":"p","x":"(i) Security"},{"t":"p","x":"(ii) Speed"},{"t":"p","x":"(iii) Accuracy"},{"t":"p","x":"(iv) Legibility"}],"o":[["A","All of them"],["B","(ii), (iii) and (iv)"],["C","(ii) and (iv)"],["D","(i) and (iv)"]],"a":"B","e":"All are said to be advantages of spreadsheet software with the exception of (i) security. A computer-based approach exposes the firm to threats from viruses, hackers and general system failure."},{"n":151,"q":"A company manufactures a single product. In a computer spreadsheet the cells F1 to F12 contain the budgeted monthly sales units for the 12 months of next year in sequence with January sales in cell F1 and finishing with December sales in F12. The company policy is for the closing inventory of finished goods each month to be 10% of the budgeted sales units for the following month. Which of the following formulae will generate the budgeted production (in units) for March next year?","c":[],"o":[["A","= [F3 + (0.1*F4)]"],["B","= [F3 - (0.1*F4)]"],["C","= [(1.1*F3) - (0.1*F4)]"],["D","= [(0.9*F3) + (0.1*F4)]"]],"a":"D","e":"Budgeted production = budgeted sales + closing inventory - opening inventory = F3 + 10% of F4 - 10% of F3 = (0.9 × F3) + (0.1 × F4)."},{"n":152,"q":"Which of the following is not one of the main aspects of formatting cells?","c":[],"o":[["A","Wrapping text"],["B","Using graphics"],["C","Setting number specification, e.g. working to 2 decimal places"],["D","Changing the font, size or colour of text"]],"a":"B","e":"Using graphics is usually done using the chart wizard not the format cells option."},{"n":153,"q":"For which of the following tasks would a spreadsheet be most useful?","c":[],"o":[["A","Exception reporting"],["B","Annual staff appraisals"],["C","Writing a news letter"],["D","Categorising products by a range of different factors (price, location, customer, date launched, etc)"]],"a":"A","e":"B would be done best via a face to face discussion. C would be best done using a word processing package. D would be best done using a database."},{"n":154,"q":"The following spreadsheet shows an extract from a company's cash flow forecast.","c":[{"t":"table","h":["","A","B","C","D","E"],"r":[["1","Cash flow forecast","","","",""],["2","","","","",""],["3","","Jan","Feb","March",""],["4","Inflows","","","",""],["5","Cash sales","10,000","12,000","11,500",""],["6","Cash from debtors","24,500","26,200","15,630",""],["7","Disposal of non-current assets","0","0","12,000",""],["8","Other","10","0","0",""],["9","Total inflows","34,510","38,200","39,130",""]]},{"t":"p","x":"Which of the following formulae will generate the correct figure for cell D9?"}],"o":[["A","SUM(D5:D8)"],["B","SUM(D5:D8)"],["C","= SUM(D5:D8)"],["D","= SUM(D5:D8)"]],"a":"C","e":"The correct syntax has an = sign and a colon."},{"n":155,"q":"Figures in a spreadsheet cell have been formatted as 'number'. Which of the following characteristics will NOT be available to adjust?","c":[],"o":[["A","Number of decimal places"],["B","Commas to indicate thousands"],["C","Negative number formatting options"],["D","Currency symbols"]],"a":"D","e":"Depending on which number formatting category you select, you will be able to adjust decimal places, negative number format, 1000 separator, but currency symbols are only available in the Currency and Accounting categories."},{"n":156,"q":"Figures in a spreadsheet cell have been formatted as 'accounting'. Which of the following characteristics will NOT be available to adjust?","c":[],"o":[["A","Number of decimal places"],["B","Commas to indicate thousands"],["C","Negative number formatting options"],["D","Currency symbols"]],"a":"C","e":"The Accounting format does not allow you to adjust the negative number format."},{"n":157,"q":"What is the effect of using brackets in a spreadsheet formula?","c":[],"o":[["A","Divisions and multiplications are calculated before additions and subtractions"],["B","Additions and subtractions are calculated before divisions and multiplications"],["C","The contents of the brackets are calculated first"],["D","The contents of the brackets are calculated last"]],"a":"C","e":"In this respect spreadsheets follow the usual rules for the use of brackets."},{"n":158,"q":"The following spreadsheet shows an extract from a company's sales figures.","c":[{"t":"table","h":["","A","B","C","D","E"],"r":[["1","Sales","","","",""],["2","","2010","2011","2012",""],["3","Region","","","",""],["4","NW","10,000","12,000","11,500",""],["5","NE","7,000","6,200","8,200",""],["6","SE","3,000","10,000","12,000",""],["7","SW","1,500","5,750","5,600",""]]},{"t":"p","x":"The management accountant wishes to produce a chart to demonstrate the trends over time between the different regions and is considering the following charts:"},{"t":"p","x":"(i) Stacked (compound) bar chart"},{"t":"p","x":"(ii) Line charts"},{"t":"p","x":"(iii) Pie charts"},{"t":"p","x":"Which of the charts would be effective at demonstrating the trends?"}],"o":[["A","(i) only"],["B","(i) and (ii)"],["C","(ii) only"],["D","(i), (ii) and (iii)"]],"a":"B","e":"Pie charts will be least effective to show trends but both of the others will work, although you could argue that the line chart is best."},{"n":159,"q":"What type of error message does Excel give when you try to divide by a blank cell?","c":[],"o":[["A","#VALUE!"],["B","#DIV/0!"],["C","#NUM!"],["D","#REF!"]],"a":"B","e":"#DIV/0! occurs where we have tried to divide by zero or a blank cell."},{"n":160,"q":"What type of error message does Excel give when you place an invalid argument in a function?","c":[],"o":[["A","#VALUE!"],["B","#DIV/0!"],["C","#NUM!"],["D","#REF!"]],"a":"C","e":"#NUM! occurs when you place an invalid argument in a function."},{"n":161,"q":"Which of the following are correct descriptions applied to computer spreadsheets?","c":[{"t":"p","x":"(1) The intersection of each row and column defines a cell"},{"t":"p","x":"(2) Data is organised in rows and columns"},{"t":"p","x":"(3) An entire page of rows and columns is called a workbook"},{"t":"p","x":"(4) Each column is identified by a number"}],"o":[["A","(1) and (2) only"],["B","(2) and (4) only"],["C","(3) and (4) only"],["D","(1), (2), (3) and (4)"]],"a":"A","e":"An entire page is a worksheet (a workbook may have many worksheets) and columns are identified by letters not numbers."},{"n":162,"q":"Which of the following statements concerning spreadsheet cells are correct?","c":[{"t":"p","x":"(1) A formula in a particular cell may calculate numbers for several cells"},{"t":"p","x":"(2) Pressing CONTROL and END takes you to the last cell you entered anything into"},{"t":"p","x":"(3) Each cell can contain text, a number or a formula"},{"t":"p","x":"(4) Pressing CONTROL and HOME takes you to cell A1"}],"o":[["A","(1), (2) and (4)"],["B","(1), (3) and (4)"],["C","(2) and (3) only"],["D","(3) and (4) only"]],"a":"D","e":"(1) is false - while a formula can be copied from one cell to another, the formula in a particular cell will only give the value for that cell. (2) is false - Control+End takes you to the cell furthest into the worksheet that has been active."},{"n":163,"q":"Which of the following are reasons for formatting data in a spreadsheet?","c":[{"t":"p","x":"(1) To make text (i.e. labels) more visually interesting"},{"t":"p","x":"(2) To get data into the correct order for analysis"},{"t":"p","x":"(3) To make numbers more descriptive of what they represent"},{"t":"p","x":"(4) To make the data appear as plain text"}],"o":[["A","(1) and (3) only"],["B","(2) and (3) only"],["C","(2) and (4) only"],["D","(1), (2) and (3)"]],"a":"A","e":"Formatting is concerned with appearance. Formatting is not concerned with ordering, so statement (2) is incorrect."},{"n":164,"q":"Wrap text is an important formatting function which:","c":[],"o":[["A","Places a border around the highlighted text"],["B","Increase the height of a row containing text so that the whole of the text is visible"],["C","Aligns the text to the left, right or centre"],["D","Changes the size and font of the text"]],"a":"B","e":"Wrap text increases the height of a row so that all text is visible."},{"n":165,"q":"What is the default printing option in Excel?","c":[],"o":[["A","Portrait, A4 with gridlines"],["B","Landscape, A4 without gridlines"],["C","Portrait, A4 without gridlines"],["D","Landscape, A4 with gridlines"]],"a":"C","e":"The default print options are portrait, A4 without gridlines."},{"n":166,"q":"What would be the most effective way of demonstrating a trend in new mobile telephone sales from January to December 20X1?","c":[],"o":[["A","Pie chart"],["B","Bar chart"],["C","Table"],["D","Line graph"]],"a":"D","e":"Line graphs are very useful to demonstrate trends."},{"n":167,"q":"You work in the accounts department of a company. Your friend in the sales department has requested some accounting information and assures you that the finance director is aware of this request. Which ONE of the following should you do?","c":[],"o":[["A","Print out the information and give it to them"],["B","Give them your computer password and let them use your computer"],["C","Decline the request"],["D","Confirm the request with the finance director"]],"a":"D","e":"Accounting information is usually confidential and should not be given to anyone without the proper authority."},{"n":168,"q":"Which of the following keyboard shortcuts in Excel will print the spreadsheet you have produced?","c":[],"o":[["A","Ctrl + C > OK"],["B","Ctrl + P > OK"],["C","Ctrl + F > OK"],["D","Ctrl + R > OK"]],"a":"B","e":"The Ctrl key + P will bring up the Print function, which will then print if you click on OK."},{"n":169,"q":"On an Excel spreadsheet, a value is typed in to a cell as '10.567'. The cell is formatted as 'Number, General'. How will the number appear in the cell?","c":[],"o":[["A","10.5"],["B","10.567"],["C","$10.567"],["D","#########"]],"a":"B","e":"The number will appear as you typed it."},{"n":170,"q":"In 'Format cells, Number, Percentage', the figure 0.25 will be shown in a cell as:","c":[],"o":[["A","0.25"],["B","0.25%"],["C","25.00"],["D","25.00%"]],"a":"D","e":"The number will appear with a percentage sign after it. Most Excel spreadsheets will work to two decimal places by default."},{"n":171,"q":"If cell B3 contains the value 10.567 and cell B4 contains the formula =ROUND(B3,0), the value contained in cell B4 would be:","c":[],"o":[["A","11"],["B","10.6"],["C","10.57"],["D","10.567"]],"a":"A","e":"Rounding 10.567 will give 11."},{"n":172,"q":"To make a cell address absolute, i.e. to always use the contents of that cell, which ONE of the following symbols should be used?","c":[],"o":[["A","f"],["B","$"],["C","%"],["D","*"]],"a":"B","e":"The symbol $ makes a cell address absolute."},{"n":173,"q":"A salesman receives a basic salary and a bonus based on 5% of sales made. His basic salary is entered on to a spreadsheet in cell B5. His sales figure is split between 'home' sales in cell C5 and 'overseas' sales in cell D5. The commission percentage of 5% is entered in cell E5. Total commission is calculated in cell F5 and would be determined using the formula:","c":[],"o":[["A","= (C5 + D5) * E5"],["B","C5 + D5 * E5"],["C","(C5 + D5) * E5"],["D","= C5 + D5 * E5"]],"a":"A","e":"Total commission = total sales × 5% = (home sales + overseas sales) × 5%."},{"n":174,"q":"In cell B2 an accountant enters the number of hours employees usually work per week, which is 40 hours. In cells C10 to C14 the employees' actual hours worked are entered. They range from 38 to 42 hours dependent on the employee. In cells D10 to D14 the accountant wishes to note whether the employee will receive overtime, by using an IF function. Cell D10 should hold the formula:","c":[],"o":[["A","=IF(C10 > B2, \"OVERTIME\", \"N/A\")"],["B","=IF($C$10 > B2, \"OVERTIME\", \"N/A\")"],["C","=IF(C10 > $B$2, \"OVERTIME\", \"N/A\")"],["D","=IF(C10 > B$2, \"OVERTIME\", \"N/A\")"]],"a":"C","e":"The standard 40 hour week needs to be 'held' to compare with the employees actual hours. Using the $ sign next to B and 2 will do this."},{"n":175,"q":"The data below is not arranged in any order.","c":[{"t":"table","h":["","A","B","C","D","E"],"r":[["1","Supplier","Quantity","Price ($)","Value ($)","Rank"],["2","X","10","22","",""],["3","Z","12","4","48",""],["4","W","11","5","55",""],["5","Y","13","3","39",""]]},{"t":"p","x":"To SORT the Price ($) into descending order you should start by:"}],"o":[["A","Selecting the data range A2:C5 > Data > Sort, Choose to sort Column C"],["B","Selecting the data range A2:C5 > Data, Choose to sort Column C > Sort"],["C","Selecting the data range C2:C5 > Data > Sort > Choose to sort Column C"],["D","Selecting the data range C2:C5 > Sort > Data, Choose to sort Column C"]],"a":"A","e":"To SORT the price column C, you would need to select the data range A2:C5, right click, data, sort, choose to sort column C."},{"n":176,"q":"A company manufactures three products and wants to show how the sales mix of each product has changed from 20X1 to 20X8. Which of the following charts or diagrams would be most suitable for showing this information?","c":[],"o":[["A","Pie chart"],["B","Component bar chart"],["C","Simple bar chart"],["D","Line graph"]],"a":"B","e":"A component bar chart shows the total sales in any one year. The individual components of each bar should show the sales mix for the three different products."},{"n":177,"q":"XYZ sells into ten different countries. Which would be the most appropriate chart or diagram for showing total turnover for the year and its split into different countries?","c":[],"o":[["A","Simple bar chart"],["B","Line graph"],["C","Pie chart"],["D","Scatter diagram"]],"a":"C","e":"Given we are looking at a single period, a pie chart would be the most useful for showing the overall split."},{"n":178,"q":"Non-financial managers are likely to experience problems in understanding and interpreting management accounting reports. Which of the following statements is the least appropriate method of dealing with this problem?","c":[],"o":[["A","Highlight and explain any unusual items in the report"],["B","Discuss with users the most appropriate form of report"],["C","Include clear graphics and charts, and ensure that the narrative is as simple as possible"],["D","Ensure that only individuals with some accounting knowledge are appointed to management positions"]],"a":"D","e":"Management accounting reports should be understandable by non-financial managers. It is totally misguided to think that all managers should be financially literate."},{"n":179,"q":"Three dimensional spreadsheet would be best described by which of the following?","c":[],"o":[["A","Spreadsheets which need special glasses for users to be able to read them"],["B","Spreadsheets which need an extra, 3D programme to make them viewable on a normal computer screen"],["C","Spreadsheets which use a number of worksheets, each one linked to an overall summary worksheet"],["D","Spreadsheets spread over a number of workbooks which are not linked together"]],"a":"C","e":"The first two explanations are not related to three dimensional spreadsheets. The final description is not three dimensional as the workbooks are not linked together. Option C is the correct definition."},{"n":180,"q":"Which of the following are justifications for the widespread use of computers in the provision of management information?","c":[{"t":"p","x":"1. Speed of processing"},{"t":"p","x":"2. Accuracy of processing"},{"t":"p","x":"3. Volume and complexity of processing requirements"}],"o":[["A","1 and 2 only"],["B","1 and 3 only"],["C","2 and 3 only"],["D","1, 2 and 3"]],"a":"D","e":"All of the above are justifications."},{"n":181,"q":"Which of the following is the correct syntax for a ROUND function?","c":[],"o":[["A","Round(number, digits)"],["B","Round(digits, number)"],["C","Round(number, digits, 0)"],["D","Round(digits, number, 0)"]],"a":"A","e":"See Chapter 19, section 7.3 of the text for a full explanation of the round function."},{"n":182,"q":"Which of the following is least likely to be prepared using a spreadsheet?","c":[],"o":[["A","Variance reports"],["B","Annual accounts"],["C","Cash forecast"],["D","Annual budget"]],"a":"B","e":"Spreadsheets are commonly used for internal, management accounting information such as variance reports, budgets and forecasts. The annual accounts are more likely to use word processing or publishing software."},{"n":183,"q":"Which of the following mathematical symbols used in formulae is in the correct order of precedence in spreadsheet calculations?","c":[],"o":[["A","/ \\ + -"],["B","+ - / \\"],["C","+ - \\ /"],["D","\\ / + -"]],"a":"A","e":"This is the order in which the symbols will be interpreted when entered into a spreadsheet formula."},{"n":184,"q":"If three adjacent columns are selected at once and the hide function is used, which column or columns will be hidden?","c":[],"o":[["A","All three columns"],["B","The column in the middle only"],["C","The columns on the outside only"],["D","No columns"]],"a":"A","e":"All selected columns will be hidden."},{"n":185,"q":"To unhide a hidden row, a user must first select?","c":[],"o":[["A","The row that is hidden"],["B","The rows above and below the hidden row"],["C","The entire worksheet"],["D","The entire workbook"]],"a":"B","e":"It would not be possible to select the hidden row as it is hidden. A user must select the rows above and below the hidden row or rows."},{"n":186,"q":"Which of the following password options would allow a user to view a spreadsheet but not allow them to make changes without entering a password?","c":[],"o":[["A","Password to open"],["B","Password to modify"],["C","Read only recommended"],["D","None of the above"]],"a":"B","e":"The password to open option would not allow the user to even view the spreadsheet. The 'read only recommended' option simply makes a recommendation. The password to modify option will prompt the user to enter a password before making changes."},{"n":187,"q":"When protecting individual cells in a spreadsheet, what must a user do to the worksheet?","c":[],"o":[["A","Lock the worksheet"],["B","Protect the worksheet"],["C","Unprotect the worksheet"],["D","Nothing at all"]],"a":"B","e":"Protect the worksheet."},{"n":188,"q":"Which of the following custom formats would result in negative numbers being shown with brackets around them?","c":[],"o":[["A","- #,#0"],["B","#,#0(,#,#0)"],["C","#,#0; - #,#0"],["D","#,#0;(#,#0)"]],"a":"D","e":"There must be two parts to the custom format - one for positive numbers and one for negative numbers. The two parts must be separated by a semicolon. To show negative numbers with brackets the second part of the format must be surrounded by brackets."},{"n":189,"q":"Which of the following custom formats would result in numbers with a zero value not being displayed on a spreadsheet?","c":[],"o":[["A","- #,#0;"],["B","#,#0;(#,#0);0"],["C","#,#0;[Zero]"],["D","#,#0;(#,#0);"]],"a":"D","e":"There must be three parts to the custom format when we want to show zeros as blanks. To show zeros as blanks the third part must be blank."},{"n":190,"q":"How should the time 25 past four p.m. be entered onto a spreadsheet?","c":[],"o":[["A","16.25.00 pm"],["B","4;25;00 pm"],["C","16:25:00"],["D","16;25;00"]],"a":"C","e":"The time format must be split by a colon."},{"n":191,"q":"Examine the following spreadsheet extract:","c":[{"t":"table","h":["","A","B","C","D"],"r":[["1","Sales Month","Product 1","Product 2","Total"],["2","Jan","15","8","23"],["3","Feb","16","7","23"],["4","Mar","14","Four",""],["5","","","",""]]},{"t":"p","x":"The formula in cell D2 is: = B2 + C2."},{"t":"p","x":"If this formula was copied to cell D4, which error message would appear?"}],"o":[["A","#DIV/0!"],["B","#VALUE!"],["C","#REF!"],["D","#NAME?"]],"a":"B","e":"The spreadsheet won't recognise the text 'Four' as a number and will remind the user to input a number rather than text."},{"n":192,"q":"Which of the following is not an advantage of component bar charts?","c":[],"o":[["A","The relative importance of each component can be assessed"],["B","The information can be interpreted quickly"],["C","More than one component can be displayed at a time"],["D","The total value can be easily assessed and determined"]],"a":"D","e":"If the bar chart is split into components it is more difficult to see the overall total."},{"n":193,"q":"Which of the following graphs would best be used to identify trends in data?","c":[],"o":[["A","A bar chart"],["B","A pie chart"],["C","A line graph"],["D","A scatter graph"]],"a":"C","e":"Line graphs will identify trends as it will be easy to see upward or downward patterns."},{"n":194,"q":"Which of the following graphs would best be used to illustrate that two variables are uncorrelated?","c":[],"o":[["A","A bar chart"],["B","A pie chart"],["C","A line graph"],["D","A scatter graph"]],"a":"D","e":"The other graphs/charts rely on some correlation between the variables. A scatter graph is more likely to illustrate a random pattern or non-relationship."},{"n":195,"q":"Under which menu is the chart wizard found in Microsoft Excel 2010?","c":[],"o":[["A","Formulas"],["B","Page Layout"],["C","View"],["D","Insert"]],"a":"D","e":"Insert."},{"n":196,"q":"Which of the following chart options would allow a user to change the positioning of the key which explains what each bar represents in a bar chart?","c":[],"o":[["A","Chart title"],["B","Legend"],["C","Data labels"],["D","Data table"]],"a":"B","e":"Legend refers to the key and using the legend option allows a user to determine where the key gets displayed on a chart."},{"n":197,"q":"Which of the following is the best way to ensure that the titles on a spreadsheet remain in view regardless of which position a user scrolls to within the spreadsheet?","c":[],"o":[["A","Split screen"],["B","Freeze panes"],["C","Consolidate data"],["D","Rename the columns"]],"a":"B","e":"Freeze panes."},{"n":198,"q":"Which of the following allows a user to determine which part of a spreadsheet is printed?","c":[],"o":[["A","Page setup"],["B","Margins setup"],["C","Header/footer settings"],["D","Sheet setup"]],"a":"D","e":"Sheet setup."},{"n":199,"q":"Which of the following allows a user to access more worksheets than the standard three?","c":[],"o":[["A","Press 'Shift' and 'F11'"],["B","Press 'File', 'Worksheet', '4'"],["C","Press 'Shift', 'F10'"],["D","Press 'File', 'Worksheet'"]],"a":"A","e":"Press 'Shift' and 'F11'."},{"n":200,"q":"Which of the following functions allows a user to locate the word 'January' in their spreadsheet and change it to the word 'February'?","c":[],"o":[["A","Find and replace"],["B","Find and select"],["C","Locate and replace"],["D","Locate and select"]],"a":"A","e":"Find and replace."},{"n":201,"q":"Which of the following allows a user to save their spreadsheet?","c":[],"o":[["A","Click on 'File', 'Save As'"],["B","Right click the mouse and select Save"],["C","Left click on the mouse and press Save"],["D","Click on 'Save'"]],"a":"A","e":"Click on 'File', 'Save As'."},{"n":202,"q":"Which of the following would indicate that a comment has been added to a cell?","c":[],"o":[["A","A red marker in the top left of the cell"],["B","A red marker in the top right of the cell"],["C","A blue marker in the top left of the cell"],["D","A blue marker in the top right of the cell"]],"a":"B","e":"A red marker in the top right of the cell."}]},{"name":"Mock Exam Questions","qs":[{"n":1,"q":"The following statements relate to financial accounting or to cost and management accounting:","c":[{"t":"p","x":"(i) Financial accounts are historical records."},{"t":"p","x":"(ii) Cost accounting is part of financial accounting and establishes costs incurred by an organisation."},{"t":"p","x":"(iii) Management accounting is used to aid planning, control and decision making."},{"t":"p","x":"Which of the statements are correct?"}],"o":[["A","(i) and (ii) only"],["B","(i) and (iii) only"],["C","(ii) and (iii) only"],["D","(i), (ii) and (iii)"]],"a":"B","e":"Cost accounting is not part of financial accounting."},{"n":2,"q":"Which of the following is not necessarily a quality of good management information?","c":[],"o":[["A","Timeliness"],["B","Relevance"],["C","Understandability"],["D","Prudence"]],"a":"D","e":"Prudence is a desirable quality in financial accounting information. However, it is not necessarily a quality in management information."},{"n":3,"q":"Which of the following statements concerning data and information is true?","c":[],"o":[["A","Information and data are two words used to describe the same thing."],["B","Information consists of raw facts and figures that have yet to be processed."],["C","Data consists of information that has been processed in a predefined way."],["D","Information consists of data that has been processed in a predefined way."]],"a":"D","e":"By definition."},{"n":4,"q":"Payments to suppliers are entered into an integrated computerised accounting system. Which of the following does not happen when these payments are entered into the computerised system?","c":[],"o":[["A","The supplier's individual account is updated in the purchase ledger/payables ledger."],["B","The payables control account in the nominal ledger (main ledger) is debited."],["C","The bank account in the nominal ledger is credited."],["D","The receivables control account in the nominal ledger is credited."]],"a":"D","e":"The receivables control account is unaffected by payments to suppliers."},{"n":5,"q":"Integrated accounts application packages have a number of advantages. Which of the following is not one of them?","c":[],"o":[["A","User-friendly, as the functions will be similar in each module"],["B","Tailored to suit the requirements of the business"],["C","Compatibility between the modules"],["D","Efficiency, as there is no need to quit one application to access another"]],"a":"B","e":"When an integrated system is purchased 'off-the-shelf' (i.e. when it is an 'applications package') the user must take it as it comes, and the system is not tailored exactly to the user's requirements."},{"n":6,"q":"In a large organisation, which of the following individuals is most likely to authorise the payment of a purchase invoice for goods bought from a supplier?","c":[],"o":[["A","manager with appropriate authority in the accounts department"],["B","manager with appropriate authority in the buying department"],["C","manager with appropriate authority in the department that requisitioned the goods"],["D","manager with appropriate authority in the stores department"]],"a":"B","e":"The authorisation for a payment should come from the department that can check that the purchase invoice details agree with the purchase order details and the goods received note details."},{"n":7,"q":"What is the main purpose of books of prime entry?","c":[],"o":[["A","Assist the preparation of financial statements"],["B","Assist the monthly bank reconciliation"],["C","Provide a check on the double-entry bookkeeping"],["D","Prevent unnecessary detail in the ledgers"]],"a":"D","e":"The main purpose of books of prime entry is to allow the main double entry into the nominal ledger to comprise totals."},{"n":8,"q":"Noel is considering introducing a number of control systems into his business. However, he is uncertain about what this would accomplish. Which of the following is NOT a purpose of organisational control systems?","c":[],"o":[["A","Safeguarding of company assets"],["B","Prevention of errors"],["C","Increased profitability"],["D","Increased efficiency"]],"a":"C","e":"Control systems may indirectly improve profitability through increased efficiency, etc., but it is not one of their primary purposes."},{"n":9,"q":"In an interlocking accounting system what would be the correct double entry for the issue of direct materials from a warehouse?","c":[],"o":[["A","Dr Raw material inventory Cr Work in progress"],["B","Dr Raw material inventory Cr Production overhead"],["C","Dr Work in progress Cr Raw material inventory"],["D","Dr Production overhead Cr Raw material inventory"]],"a":"C","e":"The credit entry must recognise that the materials have been taken out of inventory. Given the materials are \"direct\", then the debit entry must be to WIP."},{"n":10,"q":"Management information is used at different levels of the organisation","c":[{"t":"p","x":"(i) Information used by strategic management tends to be summarised."},{"t":"p","x":"(ii) Information used by strategic management tends to be forward looking."},{"t":"p","x":"(iii) information used by operational management tends to contain estimates."},{"t":"p","x":"(iv) information used by operational management tends to be required frequently."},{"t":"p","x":"Which of the above statements are true?"}],"o":[["A","(i), (ii) and (iv) only"],["B","(i), (iii) and (iv) only"],["C","(ii) and (iii) only"],["D","(iii) and (iv) only"]],"a":"A","e":"(iii) is incorrect as operational level information is usually accurate."},{"n":11,"q":"What document may be used to authorise the issue of items from the stores department to a user department?","c":[],"o":[["A","Purchase order"],["B","Delivery note"],["C","Requisition note"],["D","Goods received note"]],"a":"C","e":"A materials requisition note is a document requesting materials from stores."},{"n":12,"q":"The current inventory position for inventory item 35528 is as follows:","c":[{"t":"table","h":null,"r":[["Held in inventory","14,500 units"],["On order from supplier","36,300 units"],["Requisitioned","16,700 units"]]},{"t":"p","x":"What is the free inventory for this item?"}],"o":[["A","0"],["B","5,100 units"],["C","34,100 units"],["D","38,500 units"]],"a":"C","e":"Free inventory = 14,500 + 36,300 - 16,700 = 34,100 units."},{"n":13,"q":"The following documents are used within a cost accounting system:","c":[{"t":"p","x":"(i) invoice from supplier"},{"t":"p","x":"(ii) purchase order"},{"t":"p","x":"(iii) purchase requisition"},{"t":"p","x":"(iv) stores requisition"},{"t":"p","x":"Which TWO of the documents are matched with the goods received note in the buying process?"}],"o":[["A","(i) and (ii)"],["B","(i) and (iv)"],["C","(ii) and (iii)"],["D","(iii) and (iv)"]],"a":"A","e":"An invoice is matched to a goods received note and a purchase order before payment is made."},{"n":14,"q":"Which of the following items of cost cannot be treated as a sales and distribution overhead expense within a manufacturing business?","c":[],"o":[["A","Cost of after-sales service to customers"],["B","Telephone charges"],["C","Cost of building insurance"],["D","Warehouse rental for storage of raw materials"]],"a":"D","e":"In a manufacturing business, rental costs for the raw materials warehouse are a production overhead cost."},{"n":15,"q":"An engineering business has a department with a work force of eight engineers and one supervisor. The department carries out small engineering jobs for business customers. Which of the following costs would be treated as a direct expense of a particular job for a customer?","c":[],"o":[["A","Supervision costs"],["B","Cost of delivery of equipment to the customer"],["C","Depreciation of engineering equipment"],["D","Cost of engineer's time on the job"]],"a":"B","e":"Supervision costs and depreciation of equipment are general overhead costs. The costs of delivery and wages costs are both direct costs, but the wages cost is a direct labour cost. The delivery charge would be a direct expense."},{"n":16,"q":"Which of the following is an example of external information?","c":[],"o":[["A","Idle time reports"],["B","Sales price lists"],["C","Health and safety regulations"],["D","Accident at work reports"]],"a":"C","e":"External information is information that comes from outside the organisation. Price lists for the organisation's own products, idle time records and accident records are all internal information."},{"n":17,"q":"Which ONE of the following would be classified as direct labour?","c":[],"o":[["A","Personnel manager in a company servicing cars"],["B","Cleaner in a cleaning company"],["C","General manager in a DIY shop"],["D","Maintenance manager in a company producing cameras"]],"a":"B","e":"Cleaner in a cleaning company. The cleaner's wages can be identified with a specific cost unit therefore this is a direct cost."},{"n":18,"q":"Which of the following may be used to support claims for overtime payments for salaried staff?","c":[],"o":[["A","Employee record cards"],["B","Job cards"],["C","Payslips"],["D","Timesheets"]],"a":"D","e":"Timesheets."},{"n":19,"q":"In accounting systems, data is usually organised using codes. Which one of the following statements about codes is incorrect?","c":[],"o":[["A","Using codes helps to improve the speed and accuracy of data processing"],["B","Using codes allows more data validation checks to be carried out"],["C","A hierarchical code structure makes it easier to find items on a code list, since similar items are grouped"],["D","Codes in accounting reduce the need for accountants to understand the principles of accounting"]],"a":"D","e":"Statements A, B and C are all correct. Using codes does not take away the need to understand the work that is being done or the items that are being processed."},{"n":20,"q":"Gregs Ltd operates from four main sites. In analysing its costs (overheads) it uses a nine digit coding system. A sample from the coding manual shows:","c":[{"t":"table","h":["Site","Expenditure type","Function"],"r":[["Wokingham 100","Rent 410","Purchasing 600"],["Windsor 200","Power 420","Finance 610"],["Winchester 300","Heat and light 430","Production 620"],["Warwick 400","Travel costs 440","Sales 630"]]},{"t":"p","x":"The order of coding is: site/expense/function"},{"t":"p","x":"An invoice for the Windsor site for travel costs for sales teams would be coded as:"}],"o":[["A","200/410/600"],["B","200/420/610"],["C","200/430/620"],["D","200/440/630"]],"a":"D","e":"200 for Windsor, 440 for travel costs, 630 for sales."},{"n":21,"q":"The performance of an investment centre is measured by residual income. In a particular period, the investment centre had fixed assets of $200,000 and net current assets of $40,000. Its annual profits were as follows:","c":[{"t":"table","h":null,"r":[["Sales price","$217,000"],["Direct costs of the division","$175,000"],["Apportioned head office costs","$15,000"],["Total divisional costs","$190,000"],["Profit","$27,000"]]},{"t":"p","x":"The notional interest on capital is 8%."},{"t":"p","x":"What was the residual income for the centre for the year?"}],"o":[["A","$7,800"],["B","$11,000"],["C","$22,800"],["D","$26,000"]],"a":"A","e":"Capital employed = $200,000 + $40,000 = $240,000. Notional interest = 8% × $240,000 = $19,200. Residual income = $27,000 - $19,200 = $7,800."},{"n":22,"q":"Which of the following measures of performance is unsuitable for a profit centre?","c":[],"o":[["A","Sales income per employee"],["B","Profit as a percentage of sales revenue"],["C","Return on capital employed"],["D","Cost per machine hour operated"]],"a":"C","e":"An unsuitable measure of performance for a profit centre is one that relates profits to capital employed (ROCE). ROCE could be a suitable performance measure for an investment centre."},{"n":23,"q":"Which of the following statements is incorrect?","c":[],"o":[["A","There may be several investment centres within a single organisation"],["B","There may be several cost centres within an investment centre"],["C","There may be several cost centres within a profit centre"],["D","There may be several profit centres within a cost centre"]],"a":"D","e":"There will not be several profit centres (manager responsible for revenues and costs) in a cost centre (manager responsible for costs only)."},{"n":24,"q":"In a system of absorption costing, why are the absorption rates for fixed overheads usually determined in advance, as part of the budget, instead of retrospectively at the end of the budget period?","c":[],"o":[["A","It is simpler to decide overhead rates in advance than retrospectively."],["B","It is not possible to calculate actual overhead costs retrospectively."],["C","So that fixed overheads can be charged to output before the end of the accounting period."],["D","Predetermined overheads are more accurate than overhead costs calculated retrospectively."]],"a":"C","e":"If the budget period is one year, it would be inconvenient to wait up to one year to calculate the actual overhead costs of production retrospectively."},{"n":25,"q":"The annual costs of supervision in a department are estimated to be $40,000 if hours worked in the department are less than 32,000 each year, $65,000 if hours worked are between 32,000 and 50,000 and $80,000 if hours worked are over 50,000 in the year. These costs are an example of:","c":[],"o":[["A","a semi-fixed cost"],["B","a fixed cost"],["C","a stepped cost"],["D","a variable cost"]],"a":"C","e":"This is a stepped cost. A stepped cost is a cost that is fixed within a certain range of activity levels, but then changes if the activity level rises above or falls below that range."},{"n":26,"q":"You are presented with the following information about sales and costs for a business that makes and sells a range of products:","c":[{"t":"table","h":null,"r":[["Sales revenue","$320,000"],["Direct labour","$100,000"],["Direct material","$75,000"],["Production overhead","$78,000"],["Other overhead costs","$50,000"]]},{"t":"p","x":"The business uses absorption costing. There were no opening or closing inventories of the product."},{"t":"p","x":"What profit would be reported for the period, using absorption costing?"}],"o":[["A","$15,000"],["B","$17,000"],["C","$20,000"],["D","$23,000"]],"a":"B","e":"Sales revenue $320,000 - Direct labour $100,000 - Direct material $75,000 - Production overhead $78,000 = $67,000 - Other overhead costs $50,000 = Profit $17,000."},{"n":27,"q":"Which of the following statements IS true when applied to fixed costs:","c":[],"o":[["A","Overhead costs are always fixed costs"],["B","As production levels increase, fixed cost per unit decreases"],["C","Fixed costs are always irrelevant in a decision making situation"],["D","as the level of activity changes, fixed costs will also change"]],"a":"B","e":"As production levels increase, fixed cost per unit decreases."},{"n":28,"q":"Which of the following cost classifications is most useful for forecasting?","c":[],"o":[["A","Direct v indirect"],["B","Production v non-production"],["C","Fixed v variable"],["D","Controllable v non-controllable"]],"a":"C","e":"When forecasting it is key to understand cost behaviour."},{"n":29,"q":"Hannah works as a trainee accountant for a large accountancy firm. She is salaried and each month completes a time sheet indicating how much time she has spent working on which clients. In March Hannah's time was fully utilized on client work but she didn't do any overtime. From her firm's perspective, how should Hannah's salary costs for March be classified?","c":[],"o":[["A","Fixed Direct"],["B","Fixed Indirect"],["C","Variable Direct"],["D","Variable Indirect"]],"a":"A","e":"Hannah's salary does not depend on whether or not she works on client work, hence her salary cost is fixed. The fact that Hannah completes a timesheet allows her firm to apportion her salary costs to clients, hence her salary costs are direct."},{"n":30,"q":"A company achieves bulk buying discounts on quantities of raw material above a certain level. These discounts are only available for the units above the specified level and not on all the units purchased. Which of the following graphs of total purchase cost against units best illustrates the above situation?","c":[{"t":"i","x":"(Graphs A, B, C, D showing different cost behaviours)"}],"o":[["A","Graph A"],["B","Graph B"],["C","Graph C"],["D","Graph D"]],"a":"C","e":"Raw materials are a variable cost so the graph will begin at the origin and increase at a gradient equal to the cost per unit. The cost per unit falls at a certain point so the gradient will become less and the graph will be flatter."},{"n":31,"q":"A direct labour employee receives a wage of $8 per hour for a 38-hour week, with time + 25% for overtime. During a particular week, the employee worked for 42 hours. Due to an equipment breakdown and the late delivery of urgent materials from a supplier, the employee had to record six hours of idle time for the week. What amount will be charged as a direct labour cost for the employee's work in the week?","c":[],"o":[["A","$288"],["B","$296"],["C","$304"],["D","$336"]],"a":"A","e":"Total hours worked 42 - Idle time 6 = Hours actively worked 36. Basic rate per hour $8 × 36 = $288. The overtime premium and the cost of idle time will be treated as an indirect labour cost."},{"n":32,"q":"A manufactured product requires two units of raw materials, each costing $5. The following budget decisions have been made for the next budget period.","c":[{"t":"table","h":null,"r":[["Sales volume","9,000 units"],["Opening inventory of raw materials","3,500 units"],["Closing inventory of raw materials","2,800 units"]]},{"t":"p","x":"What is the raw materials purchase requirement for the period?"}],"o":[["A","$76,500"],["B","$83,500"],["C","$86,500"],["D","$93,500"]],"a":"C","e":"Materials usage budget = 9,000 × 2 = 18,000 units. Add closing inventory 2,800 - Less opening inventory 3,500 = Materials purchases 17,300 units. Cost per unit $5 = $86,500."},{"n":33,"q":"The following information is available for a small business with three departments, A, B and C that all operate in the same building.","c":[{"t":"table","h":["","Department A","Department B","Department C"],"r":[["Floor area (square metres)","1,500","2,000","1,500"],["Number of employees","10","6","4"],["Assets","$40,000","$40,000","$80,000"],["Labour hours per month","1,200","1,000","800"]]},{"t":"p","x":"Employees are provided with free lunchtime meals, and the cost of this small 'canteen' service is $1,800 per month."},{"t":"p","x":"If the businesses uses an absorption costing system, what would be the most appropriate charge to department A each month for the cost of the canteen service?"}],"o":[["A","$540"],["B","$900"],["C","$450"],["D","$720"]],"a":"B","e":"Presumably, each employee receives the same benefits from the service, therefore the most suitable basis for apportioning the cost should be the number of employees in each department. Department A should therefore be charged with $1,800 × (10 / 20) = $900."},{"n":34,"q":"The following data relates to a company's payroll for the month just ended:","c":[{"t":"table","h":null,"r":[["Paid to employees","$67,000"],["Employees' National Insurance contributions","$21,000"],["Employer's National Insurance contributions","$13,200"],["Income tax","$36,300"],["Employer's contribution to employees' pension fund","$15,000"]]},{"t":"p","x":"What is the total labour cost for the month?"}],"o":[["A","$152,500"],["B","$139,300"],["C","$137,500"],["D","$124,300"]],"a":"A","e":"Gross pay = Paid to employees + Employees' NI + Income tax = $67,000 + $21,000 + $36,300 = $124,300. Total labour cost = Gross pay + Employer's NI + Employer's pension = $124,300 + $13,200 + $15,000 = $152,500."},{"n":35,"q":"A product uses 6 kilograms of raw material and takes two direct labour hours to make. Raw materials cost $2.50 per kilogram and direct labour is paid $4 per hour. Variable production overheads are 25% of labour costs. The budgeted fixed production costs for the year were $120,000 and budgeted direct labour hours were 20,000 hours. Fixed overheads are recovered on a direct labour hour basis. The full production cost per unit of product is:","c":[],"o":[["A","$25"],["B","$31"],["C","$35"],["D","$37"]],"a":"D","e":"Fixed production overhead absorption rate = $120,000 / 20,000 hours = $6 per direct labour hour. Direct materials (6 kg × $2.50) = $15. Direct labour (2 hours × $4) = $8. Variable production overhead (25% of 2 hours × $4) = $2. Fixed production overhead (2 hours × $6) = $12. Full production cost per unit = $37."},{"n":36,"q":"Which of the following would operate a job costing system?","c":[],"o":[["A","Shipbuilder"],["B","Oil refinery"],["C","Steel producer"],["D","Kitchen fitter"]],"a":"D","e":"Kitchen fitting consists of short jobs for customers, with each job being different. A shipbuilder will operate a contract costing system, and an oil refinery and a steel producer are likely to have process costing systems."},{"n":37,"q":"Completed output from a manufacturing process in a period totalled 5,640 units. There was no work-in-progress at the beginning of the period but 780 units, 60% complete, remained in the process at the end of the period. What are the equivalent units of the closing work-in-progress?","c":[],"o":[["A","312"],["B","468"],["C","780"],["D","6,108"]],"a":"B","e":"Closing work-in-progress is 780 × 0.6 = 468."},{"n":38,"q":"A manufacturing process had no work-in-progress at the beginning of a period. 20,000 units of raw material, costing $8.20 per unit, were input to the process in the period. 18,600 completed units were transferred out. Conversion costs were $7.65 per completed unit and $6.12 per incomplete unit. What was the value of the closing work-in-progress?","c":[],"o":[["A","$8,568"],["B","$20,048"],["C","$22,190"],["D","$30,788"]],"a":"B","e":"There are 20,000 - 18,600 = 1,400 units of work-in-process. These are valued at $8.20 + $6.12 = $14.32. 1,400 × $14.32 = $20,048."},{"n":39,"q":"A company values stocks using the weighted average value after each purchase. The following materials receipts and issues were made last month:","c":[{"t":"table","h":["Date","Receipts Units","$/unit","Valuation","Issues"],"r":[["Brought forward","100","$5.00","$500",""],["4th","150","$5.50","$825",""],["16th","","","","100"],["20th","100","$6.00","$600",""],["21st","","","","75"]]},{"t":"p","x":"What is the value of the closing stock using this weighted average method?"}],"o":[["A","$1,012.50"],["B","$976.50"],["C","$962.50"],["D","$925.00"]],"a":"B","e":"After 4th: 250 units, $1,325, avg $5.30. Issue 100: 150 units, $795, avg $5.30. After 20th: 250 units, $1,395, avg $5.58. Issue 75: 175 units at $5.58 = $976.50."},{"n":40,"q":"A firm has a high level of stock turnover and uses the FIFO (first in first out) issue pricing system. In a period of rising purchase prices, the closing stock valuation is:","c":[],"o":[["A","close to current purchase prices"],["B","based on the prices of the first items received"],["C","much lower than current purchase prices"],["D","the average of all goods purchased in the period"]],"a":"A","e":"FIFO means that the value of closing stock reflects the most recent prices paid."},{"n":41,"q":"Which of the following symbols are used in spreadsheet software?","c":[{"t":"p","x":"(i) /"},{"t":"p","x":"(ii) *"},{"t":"p","x":"(iii) ^"},{"t":"p","x":"(iv) x"}],"o":[["A","(ii) and (iii)"],["B","(i), (ii) and (iii)"],["C","(ii), (iii) and (iv)"],["D","All of them"]],"a":"B","e":"x is not used for multiplication, the * symbol is."},{"n":42,"q":"Which of the following are disadvantages of spreadsheets?","c":[{"t":"p","x":"(i) Inability to efficiently identify data errors"},{"t":"p","x":"(ii) Finite number of records"},{"t":"p","x":"(iii) Most data managers are familiar with them"},{"t":"p","x":"(iv) Lack of detailed sorting and querying abilities"}],"o":[["A","(i) and (iv)"],["B","(i), (iii) and (iv)"],["C","(i), (ii) and (iv)"],["D","All of them"]],"a":"C","e":"(iii) is an advantage."},{"n":43,"q":"Which of the following are advantages of spreadsheet software over manual approaches?","c":[{"t":"p","x":"(i) Security"},{"t":"p","x":"(ii) Speed"},{"t":"p","x":"(iii) Accuracy"},{"t":"p","x":"(iv) Legibility"}],"o":[["A","All of them"],["B","(ii), (iii) and (iv)"],["C","(ii) and (iv)"],["D","(i) and (iv)"]],"a":"B","e":"All are said to be advantages of spreadsheet software with the exception of (i) security."},{"n":44,"q":"For which of the following tasks would a computer spreadsheet be most useful?","c":[],"o":[["A","Cost coding structure"],["B","Product listing"],["C","Staff appraisal"],["D","Variance analysis"]],"a":"D","e":"Variance analysis."},{"n":45,"q":"A business wants to organise its operational data into a computer system for the entire organisation that will allow multiple-user access to files. Which of the following types of general-purpose application package would be most suitable for this purpose?","c":[],"o":[["A","Word processing"],["B","Spreadsheet"],["C","Integrated accounts"],["D","Database"]],"a":"D","e":"A database can be used to organise operational data that allows different users to access the same files for their data processing requirements."},{"n":46,"q":"The following spreadsheet shows an extract from a company's sales figures.","c":[{"t":"table","h":["","A","B","C","D","E"],"r":[["1","Sales","","","",""],["2","","2011","2012","2013",""],["3","Region","","","",""],["4","N","10,000","12,000","11,500",""],["5","S","7,000","6,200","8,200",""],["6","E","3,000","10,000","12,000",""],["7","W","1,500","5,750","5,600",""]]},{"t":"p","x":"The management accountant wishes to produce a chart to demonstrate the trends over time between the different regions and is considering the following charts:"},{"t":"p","x":"(i) Stacked (compound) bar chart"},{"t":"p","x":"(ii) Line charts"},{"t":"p","x":"(iii) Pie charts"},{"t":"p","x":"Which of the charts would be suitable?"}],"o":[["A","(i) only"],["B","(i) and (ii)"],["C","(ii) only"],["D","(i), (ii) and (iii)"]],"a":"B","e":"Pie charts will be least effective to show trends but both of the others will work."},{"n":47,"q":"Examine the following spreadsheet extract:","c":[{"t":"table","h":["","A","B","C","D"],"r":[["1","Sales Month","Product X","Product Y","Total"],["2","Jan","10,000","50,000","60,000"],["3","Feb","14,000","6,000","20,000"],["4","Mar","12,000","TBC",""]]},{"t":"p","x":"The formula in cell D2 is: = B2 + C2. If this formula was copied to cell D4, which error message would appear?"}],"o":[["A","#DIV/0!"],["B","#VALUE!"],["C","#REF!"],["D","#NAME?"]],"a":"B","e":"The spreadsheet won't recognise the text 'TBC' as a number and will remind the user to input a number rather than text."},{"n":48,"q":"To unhide a hidden row, a user must first select","c":[],"o":[["A","The entire worksheet"],["B","The entire workbook"],["C","The row that is hidden"],["D","The rows above and below the hidden row"]],"a":"D","e":"It would not be possible to select the hidden row as it is hidden. A user must select the rows above and below the hidden row or rows."},{"n":49,"q":"Examine the following spreadsheet extract for a budget calculation:","c":[{"t":"table","h":["","A","B","C"],"r":[["1","Budget for May","","$000"],["2","Sales","","120"],["3","Cost of sales","","(50)"],["4","Gross profit","","70"],["5","Selling and distribution costs","","(30)"],["6","Operating profit","","40"]]},{"t":"p","x":"Which formula in cell C6 will give the correct figure for the operating profit?"}],"o":[["A","=SUM(C2:C5)"],["B","=C4-C5"],["C","=C2-C3-C5"],["D","=SUM(C4:C5)"]],"a":"D","e":"The formula in A is no use as it includes subtotals (e.g. cell C4) in the summation, resulting in figures effectively being double counted. B and C are no use as they deduct costs that have been entered as negative numbers (so need to be added)."},{"n":50,"q":"Which of the following are reasons for formatting data in a spreadsheet?","c":[{"t":"p","x":"(1) To make text (i.e. labels) more visually interesting"},{"t":"p","x":"(2) To get data into the correct order for analysis"},{"t":"p","x":"(3) To make numbers more descriptive of what they represent"},{"t":"p","x":"(4) To make the data appear as plain text"}],"o":[["A","(1) and (3) only"],["B","(2) and (3) only"],["C","(2) and (4) only"],["D","(1), (2) and (3)"]],"a":"A","e":"Formatting is concerned with appearance. Formatting is not concerned with ordering, so statement (2) is incorrect."}]},{"name":"Specimen Exam Questions","qs":[{"n":1,"q":"Which of the following may be a cost centre?","c":[],"o":[["A","One of the hotels owned by a leisure company"],["B","The accountancy department in a business"],["C","The direct material cost of a product"],["D","The total depreciation expense of a business"]],"a":"B","e":"The accountancy department in a business."},{"n":2,"q":"All of a company's workers are paid the same hourly rate. The following spreadsheet is to be used to calculate wages earned by different workers each week. A formula is entered in cell B4 and then a fill command is used to copy this formula into cells C4 to G4.","c":[{"t":"table","h":["","A","B","C","D","E","F","G"],"r":[["1","Wage rate per hour ($)","12","","","","","",""],["2","Worker","P","Q","R","S","T","U"],["3","Hours worked","40","28","38","39","40","27"],["4","Wages earned ($)","","","","","","",""]]},{"t":"p","x":"Which of the following formulae should be entered into cell B4 prior to using the fill command to make sure that the correct formulae is used for cells C4 to G4?"}],"o":[["A","= B1 * B3"],["B","= B$1 * B3"],["C","= B1 * B$3"],["D","= B$1 * $B$3"]],"a":"B","e":"= B$1 * B3."},{"n":3,"q":"There was no work-in-progress in a manufacturing process at the start of a period. 18,000 units of a product commenced processing in the period during which completed output was 16,100 units. The work-in-progress was 75% complete for conversion costs which were $4.60 per equivalent unit. There were no losses or gains in the process. What amount was included in the closing work-in-progress for conversion costs?","c":[],"o":[["A","$6,555"],["B","$8,740"],["C","$11,653"],["D","$18,515"]],"a":"A","e":"(18,000 - 16,100) × 75% × $4.60 = $6,555."},{"n":4,"q":"Which of the following statements is true?","c":[],"o":[["A","Information consists of raw facts that have not been processed"],["B","Data consists of information"],["C","Data consists of processed information"],["D","Information consists of data which has been processed in a predefined way"]],"a":"D","e":"By definition."},{"n":5,"q":"For which of the following tasks would a computer spreadsheet be most useful?","c":[],"o":[["A","Expense coding structure"],["B","Product listing"],["C","Staff appraisal"],["D","Cost analysis"]],"a":"D","e":"Cost analysis."},{"n":6,"q":"Receipts and issues of a raw material for a period were:","c":[{"t":"table","h":["","Units","$ per unit","Cumulative total $"],"r":[["Opening inventory","160","3.70","592"],["Day 3 receipt","230","3.60","1,420"],["Day 5 issue","110","",""],["Day 8 issue","150","",""]]},{"t":"p","x":"Using the LIFO inventory pricing method, what is the total cost of the issue on Day 8?"}],"o":[["A","$540"],["B","$543"],["C","$545"],["D","$555"]],"a":"B","e":"((230 - 110) × 3.60) + (3.70 × (150 - (230 - 110))) = $543."},{"n":7,"q":"Product X is manufactured by Y Co. Direct materials cost $6.10 and prime costs total $9.60 per unit of product. Production overheads are absorbed at a rate of $13.40 per machine hour. Two units of Product X are manufactured per machine hour. Using absorption costing, what is the total production cost per unit of Product X?","c":[],"o":[["A","$16.30"],["B","$22.40"],["C","$23.00"],["D","$29.10"]],"a":"A","e":"Overhead costs per unit: $13.40 / 2 = $6.70. Total production cost per unit: $6.70 + $9.60 = $16.30."},{"n":8,"q":"Which of the following is a major advantage of the use of computer spreadsheets in management accounting?","c":[],"o":[["A","Formulas are consistent in that they usually appear as numbers"],["B","They can be printed and hard copies filed"],["C","They can be used to record the cost coding structure"],["D","What-if analysis can be carried out easily and quickly"]],"a":"D","e":"What-if analysis can be carried out easily and quickly."},{"n":9,"q":"Product X requires 1.8kg of a raw material per finished unit. The material has a weight loss of 10% in preparation for manufacture. Inventory of the material is currently 420 kg but needs to be increased to 500 kg. 2,000 units of Product X are to be manufactured. How many kg of the raw material need to be purchased to satisfy the above requirements?","c":[],"o":[["A","3,880"],["B","3,920"],["C","4,040"],["D","4,080"]],"a":"D","e":"Material required per finished unit with a 10% loss: 1.8 / 0.90 = 2. Total material required for manufacture: 2 × 2,000 = 4,000. Total materials to buy: 4,000 - 420 + 500 = 4,080."},{"n":10,"q":"At the end of a period the percentage completion of the work-in-progress in a continuous manufacturing process was over estimated. What effect would correction of the error have on the cost per equivalent unit and the total cost of output completed in the period?","c":[],"o":[["A","Unit cost: Decrease, Cost of output: Decrease"],["B","Unit cost: Decrease, Cost of output: Increase"],["C","Unit cost: Increase, Cost of output: Decrease"],["D","Unit cost: Increase, Cost of output: Increase"]],"a":"D","e":"Correction would decrease the equivalent units, which would increase the cost per equivalent unit and increase the total cost of output completed."},{"n":11,"q":"What is the purpose of prime entry records?","c":[],"o":[["A","Assist the preparation of a trial balance"],["B","Prevent unnecessary detail in the ledgers"],["C","Provide a check on the double-entry bookkeeping"],["D","Provide a list of outstanding payments"]],"a":"B","e":"Prevent unnecessary detail in the ledgers."},{"n":12,"q":"The following scatter graph plots nine observed sets of data from a factory.","c":[{"t":"i","x":"(Scatter graph showing total labour costs against number of production units)"},{"t":"p","x":"Which term would BEST describe the behaviour of total labour cost?"}],"o":[["A","Fixed cost"],["B","Stepped-fixed cost"],["C","Semi-variable cost"],["D","Variable cost"]],"a":"C","e":"Semi-variable cost."},{"n":13,"q":"A production operative is paid $11.00 per hour for a basic 35-hour week. Overtime is paid at 40% over the basic rate. The operative worked for 38 hours in week 9. Income tax deducted was $76.40 and benefit contribution payments were: Employer $40, Employee 10% of gross pay. What was the net pay of the operative in week 9?","c":[],"o":[["A","$271.68"],["B","$311.68"],["C","$316.30"],["D","$319.29"]],"a":"B","e":"Basic pay (35 × $11) = $385. Overtime pay ($11 × 1.40) × (38 - 35) = $46.20. Gross pay = $431.20. Benefit contribution ($431.20 × 10%) = $43.12. Net pay = $431.20 - $76.40 - $43.12 = $311.68."},{"n":14,"q":"No losses or gains occur in a manufacturing process. There was no work-in-progress at the start of a period during which 9,600 litres of a raw material were input to the process. 8,700 litres of finished product were output from the process in the period. The stage of completion of the work-in-progress was: Materials 100%, Conversion costs 60%. What were the equivalent units of production in the period?","c":[],"o":[["A","Materials: 8,700; Conversion costs: 8,700"],["B","Materials: 8,700; Conversion costs: 9,060"],["C","Materials: 9,600; Conversion costs: 9,240"],["D","Materials: 9,600; Conversion costs: 9,600"]]
