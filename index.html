<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACCA MA1 Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f7;--card:#fff;--ink:#16303a;--text:#1b2a2e;--mute:#5d7378;--teal:#0e6b5e;--rule:#c5d6d8;--wash:#eef5f3;--bad:#b3261e;--badbg:#fbeceb;--good:#0e6b5e;--goodbg:#e3f3ee;--sel:#dcebe8;
--sans:'Source Sans 3','Segoe UI',Carlito,Arial,sans-serif;--serif:'Source Serif 4',Georgia,'Bitstream Charter',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d22;--card:#16282f;--ink:#e6f1ef;--text:#d5e3e0;--mute:#8fa8ac;--teal:#5fc2ae;--rule:#2c444c;--wash:#1b3139;--bad:#ff8a80;--badbg:#3a1f1f;--good:#5fc2ae;--goodbg:#173a33;--sel:#24474d}}
:root[data-theme="dark"]{--bg:#0f1d22;--card:#16282f;--ink:#e6f1ef;--text:#d5e3e0;--mute:#8fa8ac;--teal:#5fc2ae;--rule:#2c444c;--wash:#1b3139;--bad:#ff8a80;--badbg:#3a1f1f;--good:#5fc2ae;--goodbg:#173a33;--sel:#24474d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--serif);line-height:1.55;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3,.sans,button{font-family:var(--sans)}
h1{font-size:34px;line-height:1.1;color:var(--ink);margin:18px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);font-family:var(--sans);margin:0 0 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toggle{font-family:var(--sans);font-size:15px;color:var(--mute);display:flex;gap:8px;align-items:center;margin:0 0 14px}
.chap{display:flex;width:100%;text-align:left;gap:14px;align-items:center;padding:14px 16px;margin:0 0 10px;background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--teal);color:var(--text);cursor:pointer;font-size:17px}
.chap:hover{background:var(--wash)}
.chap .t{flex:1}.chap b{display:block;color:var(--ink);font-size:18px;font-weight:600}
.chap small{color:var(--mute);font-size:14px}
.badge{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--teal);white-space:nowrap}
.chap.all{border-left-color:var(--ink);background:var(--ink)}.chap.all b,.chap.all small,.chap.all .badge{color:#eaf4f2}
.chap.all:hover{opacity:.93;background:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 12px;z-index:5;border-bottom:1px solid var(--rule)}
.top .meta{display:flex;justify-content:space-between;font-family:var(--sans);font-size:15px;color:var(--mute);margin-bottom:7px;gap:10px}
.top .meta b{color:var(--ink)}
.bar{height:10px;background:var(--rule)}.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--rule);padding:22px 20px;margin-top:18px}
.qn{font-family:var(--sans);font-weight:700;color:var(--teal);font-size:14px;margin-bottom:6px}
.stem{font-weight:600;color:var(--ink);font-size:19px;margin:0 0 10px}
.ctx{font-size:16px}.ctx p{margin:6px 0}.ctx .note{color:var(--mute);font-style:italic}
table{border-collapse:collapse;margin:10px 0;font-family:var(--sans);font-size:15px;max-width:100%;display:block;overflow-x:auto}
th{text-align:left;border-bottom:2px solid var(--ink);padding:4px 10px;color:var(--ink)}
td{border-bottom:1px solid var(--rule);padding:4px 10px}
.opts{margin-top:14px;display:grid;gap:9px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--rule);color:var(--text);cursor:pointer;font-family:var(--serif);font-size:17px;line-height:1.45}
.opt i{font-style:normal;font-family:var(--sans);font-weight:700;color:var(--teal);flex:0 0 22px}
.opt:hover{background:var(--wash)}
.opt.sel{background:var(--sel);border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
button.b{font-size:16px;font-weight:600;padding:11px 20px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button.b.p{background:var(--ink);color:var(--card)}
button.b:disabled{opacity:.4;cursor:default}
button.link{background:none;border:0;color:var(--mute);font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.dots button{width:30px;height:30px;font-size:13px;border:1px solid var(--rule);background:var(--card);color:var(--mute);cursor:pointer;padding:0}
.dots button.a{background:var(--sel);color:var(--ink);border-color:var(--teal)}.dots button.c{outline:2px solid var(--ink)}
.score{background:var(--ink);color:#eaf4f2;padding:26px 22px;margin:18px 0}
.score .big{font-family:var(--sans);font-size:64px;font-weight:700;line-height:1}
.score .l{font-family:var(--sans);font-size:17px;margin-top:8px}
.stats{display:flex;gap:26px;margin-top:16px;font-family:var(--sans);flex-wrap:wrap}.stats div{font-size:15px}.stats b{display:block;font-size:26px}
h3{color:var(--ink);font-size:21px;margin:30px 0 4px}
.rev{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--bad);padding:18px;margin:14px 0}
.rev .ans{font-family:var(--sans);font-size:16px;margin:5px 0;padding:8px 12px}
.ans.you{background:var(--badbg);color:var(--bad)}.ans.ok{background:var(--goodbg);color:var(--good)}
.ans span{color:var(--text)}
.exp{font-size:15.5px;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.empty{padding:20px;background:var(--goodbg);color:var(--good);font-family:var(--sans);font-weight:600;margin:14px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA=[{"name":"The Nature and Purpose of Cost and Management Accounting","qs":[{"n":1,"q":"Which of the following features are characteristic of an integrated accounting system?","c":[{"t":"p","x":"1. Management accounting and financial accounting ledger accounts are held in the same ledger."},{"t":"p","x":"2. There are no individual ledger accounts for receivables or payables."},{"t":"p","x":"3. Transactions are coded for both financial accounting purposes and management accounting purposes."}],"o":[["A","1 only"],["B","1 and 2 only"],["C","1 and 3 only"],["D","2 and 3 only"]],"a":"C","e":"With an integrated accounting system, the same ledger is used for accounts to prepare both financial accounting and management accounting information. As a consequence, transactions entered into the system need to be coded for both financial accounting and management accounting purposes. Individual ledger accounts for receivables and payables are needed in an accounting system, including an integrated accounts system."},{"n":2,"q":"Which of the following qualities is not necessarily a quality of good information?","c":[],"o":[["A","It should be relevant"],["B","It should be understandable"],["C","It should be worth more than it costs to produce"],["D","It should be available quickly"]],"a":"D","e":"Information needs to be timely - i.e. available in time for when it is needed. This is not necessarily the same as having the information available quickly, although with on-line Internet connections, it is increasingly common for information to be needed quickly."},{"n":3,"q":"Which of the following definitions best describes 'information'?","c":[],"o":[["A","Data that consists of facts and statistics before they have been processed."],["B","Data that consists of numbers, letters, symbols, events and transactions which have been recorded but not yet processed into a form that is suitable for making decisions."],["C","Facts that have been summarised but not yet processed into a form that is suitable for making decisions."],["D","Data that has been processed in such a way that it has a meaning to the person who receives it, who may then use it to improve the quality of decision making."]],"a":"D","e":"Data consists of numbers, letters, symbols, raw facts, events and transactions which have been recorded but not yet processed into a form which is suitable for making decisions. Information is data which has been processed in such a way that it has a meaning to the person who receives it, who may then use it to improve the quality of decision making."},{"n":4,"q":"Which of the following is not a purpose of management information in a company?","c":[],"o":[["A","To provide records of current and actual performance"],["B","To compare actual performance with planned performance"],["C","To help management with decision making"],["D","To inform customers about the company's products"]],"a":"D","e":"All four answers are purposes of information, but providing information to customers is an example of information for an external third party, rather than management information."},{"n":5,"q":"Which of the following is not correct?","c":[],"o":[["A","Cost accounting can be used for inventory valuation to meet the requirements of internal reporting only"],["B","Management accounting provides appropriate information for decision making, planning, control and performance evaluation"],["C","Routine information can be used for both short-term and long-run decisions"],["D","Financial accounting information can be used for internal reporting purposes"]],"a":"A","e":"Cost accounting can be used for inventory valuation to meet the requirements of both internal reporting and external financial reporting."},{"n":6,"q":"Which of the following are all qualities of good management information?","c":[],"o":[["A","Digital, brief, relevant"],["B","Reliable, consistent, timely"],["C","Secure, accurate, printed"],["D","Accessible, universal, complete"]],"a":"B","e":"Information should have certain qualities. These do not include being in either digital or printed format, nor does information have to be universal. Only answer B includes three qualities of good information, reliability, consistency and being available in time to be used (timeliness)."},{"n":7,"q":"Which of the following statements is incorrect?","c":[],"o":[["A","Management accounting reports are more accurate than financial accounting statements."],["B","Management accounting reports are more detailed than financial accounting statements."],["C","Management accounting reports are more frequent than financial accounting statements."],["D","Management accounting reports are not disclosed to shareholders and investors."]],"a":"A","e":"Financial accounting reports are prepared for external users, such as shareholders and the tax authorities, whereas management accounting reports are produced for use by management. Management accounting reports should be frequent and should contain the details that management require. However, the information in both management accounting reports and financial accounting statements should be accurate."},{"n":8,"q":"Which one of the following is always a quality of good information?","c":[],"o":[["A","Immediate availability"],["B","Availability to everyone"],["C","Reliable"],["D","Technically accurate"]],"a":"C","e":"Information should always be reliable, otherwise it is of doubtful value. Not all information needs to be available immediately. Confidential information must not be available to everyone. Information only needs to be technically accurate if technical accuracy is required for its purpose."},{"n":9,"q":"Which one of the following statements is correct?","c":[],"o":[["A","Data is held on computer in digital form whereas information is in a form that is readable to human beings."],["B","Information is obtained by processing data."],["C","Data and information mean the same thing."],["D","Data consists of numerical or statistical items of information."]],"a":"B","e":"Information is processed data. The distinction is that data is unprocessed whereas information is processed."},{"n":10,"q":"Which of the following items of information might be produced by a management accounting system?","c":[],"o":[["A","Income tax deducted from employees' wages and salaries"],["B","Amounts of money owed to suppliers"],["C","Current bank balance"],["D","Profitability of product items"]],"a":"D","e":"Items A, B and C should all be available from the financial accounting system. Cost and management accounting is more concerned with analysing the costs and profitability of products, services, activities and decisions, and with producing information for planning and control by management."},{"n":11,"q":"Which of the following is an example of external information that could be used in a management accounting system?","c":[],"o":[["A","Consumer price index statistics"],["B","Price list for the products sold by the business"],["C","Production volume achieved by the production department"],["D","Discounts given to customers"]],"a":"A","e":"External information is obtained from sources outside the organisation. Statistics relating to the consumer price index come from the government. Information about price lists, production volumes and discounts to customers comes from sources within the organisation."},{"n":12,"q":"Which of the following is not management accounting information?","c":[],"o":[["A","Sales budget"],["B","Variance report"],["C","Payroll report"],["D","Profitability report"]],"a":"C","e":"Management accounting is concerned with providing information to management to help them with planning, control and decision making. A budget (plan) for future sales, a variance report comparing actual results with a budget, and profitability reports are therefore all management accounting reports. Payroll is a separate activity. Management accounts would make use of total labour costs from the payroll system, but a payroll report is not a management accounting report."},{"n":13,"q":"Which of the following items would be included in the financial accounting system but not in the management accounting system?","c":[],"o":[["A","Sales commissions payable to sales representatives"],["B","Costs of repairs to the office air conditioning system"],["C","Profits paid out in dividends to the business owners"],["D","Direct labour costs"]],"a":"C","e":"Management accounts record revenues and costs. Sales commissions are a sales overhead cost and repairs to the office air conditioning system are an administration overhead cost. Dividends paid to the business owners are relevant to the financial accounts, not the management accounts."},{"n":14,"q":"Why is management information valuable for decision making?","c":[],"o":[["A","It enables management to make the correct decision"],["B","It helps management to reach a more informed decision"],["C","It can be used to allocate blame if a poor decision is made"],["D","It enables managers to make decisions more quickly"]],"a":"B","e":"Information cannot make sure that managers take the correct or best decision every time. It should give managers a better understanding, however, that should help them to reach a more informed decision. As a consequence, in the long term, the quality of management decision making should be much better. Answer C is not correct: allocating blame after the event is not a primary aspect of decision making."},{"n":15,"q":"Which of the following statements about office manuals is not correct?","c":[],"o":[["A","They are particularly useful for dealing with out-of-the-ordinary situations"],["B","They can be used to check on the correct procedures in cases of doubt"],["C","They can be used to help with the training of new staff"],["D","They help to maintain standards of performance"]],"a":"A","e":"Office manuals cover all predictable and routine operations and procedures, rather than unusual and out-of-the-ordinary cases. However, they can be used for reference or checking in cases of doubt. They are also used for the induction and training of staff. They also establish the methods for getting work done, and so they can be helpful in maintaining performance standards, provided staff are aware of what they contain."},{"n":16,"q":"What is a prime entry record in an accounting system?","c":[],"o":[["A","A record of an important transaction, usually a high-value transaction"],["B","An entry in the ledger accounts"],["C","The first record of a transaction entered into the accounting system"],["D","A record of direct materials, direct labour and direct expenses costs"]],"a":"C","e":"'Prime' means 'first', and prime entry records are the first records of transactions entered in the accounting system. They are recorded in books of prime entry for convenience. Subsequently, the transactions are transferred to ('posted' to) the ledger accounts."},{"n":17,"q":"Which of the following statements are correct?","c":[{"t":"p","x":"1. In a system of interlocking accounts, financial accounts and management accounts are recorded in the same ledger."},{"t":"p","x":"2. The number of errors in a computerised accounting system should be less than if a manual accounting system is used."},{"t":"p","x":"3. Transactions should be recorded more quickly in a computerised accounting system than in a manual accounting system."}],"o":[["A","Statements 1 and 2 only are correct"],["B","Statements 1 and 3 only are correct"],["C","Statement 2 only is correct"],["D","Statements 2 and 3 only are correct"]],"a":"D","e":"Statement 1 is incorrect. In a system of interlocking accounts, financial accounts and management accounts are recorded in different ledgers. Statement 2 is correct: errors will be less in a computerised system partly because of validation checks on input that can be carried out by a computer program and partly because transactions are only entered once and posting transactions to the ledgers is done automatically, reducing the likelihood of error. Statement 3 is also correct: transactions should be recorded more quickly because they are entered once into the system, and subsequent postings and transfers to the ledgers are done automatically."},{"n":18,"q":"Which of the following best describes double entry bookkeeping?","c":[],"o":[["A","A manual system of recording accounting transactions"],["B","A system of recording business transactions in ledgers"],["C","A system of recording an accounting transaction twice in the main ledger"],["D","A system of management accounting"]],"a":"C","e":"Double entry bookkeeping is a system of recording transactions relating to income, expenditure, assets, liabilities and capital twice in the main ledger (often called the nominal ledger or general ledger). The transaction is recorded as a 'debit' entry in one account in the ledger and also as a 'credit' entry in another account in the same ledger. Answer A is incorrect: computer systems as well as manual systems are based on double entry bookkeeping principles. Answer B is not an accurate definition, and answer D is totally incorrect."},{"n":19,"q":"Which of the following would be classified as data?","c":[],"o":[["A","Number of purchase requisitions"],["B","Analysis of wages into direct and indirect costs"],["C","Table showing variances from budget"],["D","Graph showing the number of labour hours worked"]],"a":"A","e":"All of the others have been processed in some way and are information."},{"n":20,"q":"Which of the following are primary data?","c":[{"t":"p","x":"(i) Information on timesheets used for making up wages."},{"t":"p","x":"(ii) Information from a government publication concerning forecast inflation rates used for budgeting."},{"t":"p","x":"(iii) Information from a trade publication used to choose a supplier of raw materials."}],"o":[["A","(i) and (ii)"],["B","(i) and (iii)"],["C","(i) only"],["D","(i), (ii) and (iii)"]],"a":"C","e":"Primary data is data which is used solely for the purpose for which it was collected."},{"n":21,"q":"Which of the following is a feature of financial accounting information?","c":[],"o":[["A","It is used to calculate the cost of a product or service"],["B","Limited companies are required by law to prepare this information"],["C","It is concerned with future results as well as historical information"],["D","The benefit must exceed the cost and it must be relevant for purpose"]],"a":"B","e":"Limited companies are required by law to prepare financial statements."},{"n":22,"q":"What is the scientific term for facts, figures and information?","c":[],"o":[["A","Consultancy"],["B","Data"],["C","Referencing"],["D","Statistics"]],"a":"B","e":"This is an unsatisfactory question. Answers A and C are not correct, because they describe activities. Statistics (answer D) are specifically numerical data/information, whereas facts and information can be non-numerical. Answer B is the required answer, although it is not strictly correct to describe information as 'data'. Information is processed data."},{"n":23,"q":"Which one of the following is true with regard to management information?","c":[],"o":[["A","It is the same as operating information"],["B","It must be produced by a computer"],["C","It should be completely accurate, regardless of cost"],["D","It should be produced if its cost is less than the increased revenue to which it leads"]],"a":"D","e":"Management information and operating information are not the same, and there is no requirement for management information to be produced by computer. Complete accuracy is not necessarily a desirable quality of information, especially if it costs a lot to obtain the perfect degree of accuracy. Management information is desirable if the cost of obtaining it is less than the expected benefits it is expected to provide."},{"n":24,"q":"Which one of the following is an example of internal information for the wages department of a large company?","c":[],"o":[["A","A Code of Practice issued by the Institute of Directors"],["B","A new national minimum wage"],["C","Changes to tax coding arrangements issued by the tax authorities"],["D","The company's employees' schedule of hours worked"]],"a":"D","e":"Internal information is information from an internal source. Information from the Institute of Directors, the tax authorities and a government department are all examples of external information."},{"n":25,"q":"Which one of the following would be included in the financial accounts, but may be excluded from the cost accounts?","c":[],"o":[["A","Bank interest and charges"],["B","Depreciation of storeroom handling equipment"],["C","Direct material costs"],["D","Factory manager's salary"]],"a":"A","e":"The cost accounts will always include items of expenditure to be included in manufacturing costs (Answers B, C and D). The cost accounts, unlike the financial accounts, might exclude expenditure relating to financial costs (e.g. bank interest)."},{"n":26,"q":"What is the most appropriate definition of an office?","c":[],"o":[["A","A centre for exchanging information between businesses"],["B","A centre for information and administration"],["C","A place where information is stored"],["D","A room where many people using IT work"]],"a":"B","e":"Definition B is the most complete and so the correct answer. Definitions A, C and D all describe aspects of the use or purpose of an office, but are not complete definitions."},{"n":27,"q":"Which one of the following is a disadvantage of office manuals?","c":[],"o":[["A","Strict interpretation of instructions creates inflexibility"],["B","The quality of service received from suppliers is reduced"],["C","They create bureaucracy and demotivate staff"],["D","They do not facilitate the induction and training of new staff"]],"a":"A","e":"Answer B is irrelevant to the question and answer D is incorrect: office manuals do facilitate the induction and training of new staff. Answer A is definitely a disadvantage: a strict interpretation of the rules does lead to inflexibility. Answer C is not necessarily correct."},{"n":28,"q":"Which one of the following is least likely to be carried out by an Accounts Department?","c":[],"o":[["A","Arrangement of payment of payables"],["B","Calculation of wages and salaries to be paid"],["C","Despatch of customer orders"],["D","Preparation of company financial records"]],"a":"C","e":"The physical despatch of goods to a customer is an operational task, which would normally be carried out by warehousing and delivery staff, or by an order despatch team."},{"n":29,"q":"What is the main purpose of prime entry records?","c":[],"o":[["A","to calculate the cash received and spent by a business"],["B","to prevent a large volume of unnecessary detail in the ledgers"],["C","to provide a monthly check on the double entry bookkeeping"],["D","to separate the transactions subject to sales tax from those that are exempt"]],"a":"B","e":"Individual transactions are recorded/listed in the books of prime entry and only daily totals (or periodic totals) - and limited information - need to be posted to the general ledger accounts. Books of prime entry therefore avoid the need to record as much data in the ledger accounts as would otherwise be necessary."}]},{"name":"Source Documents and Coding","qs":[{"n":30,"q":"Which of the following is usually responsible for preparing a delivery note?","c":[],"o":[["A","Buyer"],["B","Supplier"],["C","Stores manager"],["D","Accountant"]],"a":"B","e":"The buyer prepares a purchase order. The supplier delivers the goods to the stores department and provides a delivery note. The stores department prepares a goods received note. The accounts department receives the goods received note from the stores department and the invoice from the supplier."},{"n":31,"q":"Which of the following is in the correct chronological sequence for sales documents?","c":[],"o":[["A","Enquiry-Order-Invoice-Payment"],["B","Order-Enquiry-Invoice-Payment"],["C","Enquiry-Order-Payment-Invoice"],["D","Enquiry-Invoice-Order-Payment"]],"a":"A","e":"The sales process may begin with an enquiry from a potential customer. The customer then places the order. When the order is delivered, the customer is sent an invoice. The customer is then required to pay the invoice within the credit period allowed."},{"n":32,"q":"Which of the following is in the correct chronological sequence for purchase documents?","c":[],"o":[["A","Purchase order-Invoice-Goods received note-Delivery note"],["B","Delivery note-Goods received note-Purchase order-Invoice"],["C","Purchase order-Delivery note-Goods received note-Invoice"],["D","Goods received note-Delivery note-Purchase order-Invoice"]],"a":"C","e":"A purchase originates with a requisition for goods. The buying department negotiates purchase terms and issues a purchase order to send to the supplier. The supplier processes the order and delivers the goods. A delivery note is provided with the goods when delivered. The stores department then produces its own document to record the goods received (the goods received note). The supplier sends the invoice when the goods are delivered."},{"n":33,"q":"Which of the following documents should be checked before a purchase invoice is paid, to confirm that the price and quantities are correct?","c":[],"o":[["A","Purchase order for price, Goods received note for quantity"],["B","Goods received note for price, Delivery note for quantity"],["C","Purchase invoice for price, Goods received note for quantity"],["D","Purchase order for price, Delivery note for quantity"]],"a":"D","e":"The price should be checked against a copy of the purchase order. The quantity in the invoice should be checked against the goods received note. The goods received note is preferable to the delivery note, because the delivery note might be signed quickly, before the stores department has had time to check for faulty items or to carry out a detailed count of the items delivered."},{"n":34,"q":"You are the accountant responsible for the input into the computer accounting system of data about goods received from suppliers. For each transaction, you require a copy of the purchase order, delivery note, goods received note and invoice. Where are you most likely to find the code number for an item of inventory for entering in the system?","c":[],"o":[["A","Purchase order"],["B","Delivery note"],["C","Goods received note"],["D","Invoice"]],"a":"C","e":"The code for an item inventory should be entered on the goods received note by the stores clerk. This can be used for inputting the code to the computer system. The delivery note and purchase invoice are prepared by the supplier, so are unlikely to include an inventory code number from your own organisation."},{"n":35,"q":"Which one of the following is least likely to be carried out by the accounts department?","c":[],"o":[["A","Collecting money receivable from credit customers"],["B","Receiving goods from suppliers into store"],["C","Processing expenses claims"],["D","Arranging payments of tax to the tax authorities"]],"a":"B","e":"The accounts department deals with matters related to recording financial transactions, keeping accounting records and making and receiving payments. Its staff are most unlikely to do work in the stores department, receiving incoming deliveries of goods."},{"n":36,"q":"Hockey Skill operates from three main sites. In analysing its costs (overheads) it uses a nine digit coding system. A sample from the coding manual shows:","c":[{"t":"table","h":["Site","Expenditure type","Function"],"r":[["Whitby 100","Rent 410","Purchasing 600"],["Scarborough 200","Power 420","Finance 610"],["York 300","Heat and light 430","Production 620"],["","Travel costs 500","Sales 630"],["","Telephone and postage 520",""]]},{"t":"p","x":"The order of coding is: site/expense/function. How would an invoice for the Whitby site for power be coded?"}],"o":[["A","100/420/600"],["B","100/420/620"],["C","100/420/610"],["D","100/430/610"]],"a":"B","e":"100 for Whitby followed by 420 for power followed by 620 for production. Power costs are most likely to be a production overhead cost, rather than a purchasing, finance or sales overhead cost."},{"n":37,"q":"In accounting systems, data is usually organised using codes. Which one of the following statements about codes is incorrect?","c":[],"o":[["A","Using codes helps to improve the speed and accuracy of data processing."],["B","Using codes allows more data validation checks to be carried out."],["C","A hierarchical code structure makes it easier to find items on a code list, since similar items are grouped."],["D","Codes in accounting reduce the need for accountants to understand the principles of accounting."]],"a":"D","e":"Statements A, B and C are all correct. When codes are used, more data validation checks are possible. Codes are shorter than a description of the items they represent, so using codes speeds up processing too. Using codes does not take away the need to understand the work that is being done or the items that are being processed."},{"n":38,"q":"A firm uses a unique code to identify each customer and customer account. The code consists of the first three letters of the customer's name, followed by four digits. Which one of the following will appear first when the customers are sorted into descending order?","c":[],"o":[["A","TRO1100"],["B","TRO1214"],["C","TOP1213"],["D","TOR1102"]],"a":"B","e":"In descending order: TRO1214, TRO1100, TOR1102, TOP1213. The sorting is by the alphabetic characters first, not the numbers."},{"n":39,"q":"Inventory codes used by an organisation are eight-digit numerical codes. Inventory records are held on computer in a real-time inventory control system. Which of the following measures is most likely to prevent errors with the input of the inventory code number for each inventory transaction?","c":[],"o":[["A","Existence check"],["B","Dual input of the inventory code"],["C","Verification check"],["D","Check digit check"]],"a":"D","e":"A check digit check is a form of data validation check. This type of check is carried out by the computer program to test an item in a record for logical errors. A check digit can be included within a code, such that if there is any error keying in the code, the check digit check will automatically identify the error and report it for investigation and checking."},{"n":40,"q":"A firm uses a unique code to identify each customer - the first four letters of each name are followed by four digits. Which one of the following will appear first when customers are sorted into descending order?","c":[],"o":[["A","ADAM0001"],["B","ADAA0099"],["C","ADDA0100"],["D","ABAB0999"]],"a":"C","e":"In 'descending' order means in reverse alphabetical order. The four items in descending order are therefore: ADDA0100, ADAM0001, ADAA0099, ABAB0999."},{"n":41,"q":"Which one of the following is the correct sequential flow of documents to complete the purchase of goods on credit?","c":[],"o":[["A","Goods received note, purchase order, cheque requisition, invoice, delivery note"],["B","Purchase order, delivery note, goods received note, invoice, cheque requisition"],["C","Purchase order, goods received note, delivery note, cheque requisition, invoice"],["D","Purchase order, invoice, goods received note, cheque requisition, delivery note"]],"a":"B","e":"The buying department places a purchase order with the supplier. The supplier delivers the goods, and provides a delivery note. A person in the stores department then prepares a goods received note. The supplier will send an invoice when the goods have been delivered. When the invoice has been authorised for payment, a cheque requisition might be prepared."},{"n":42,"q":"Which member of staff is most likely to raise a goods received note?","c":[],"o":[["A","Delivery driver"],["B","Finance director"],["C","Sales ledger clerk"],["D","Store clerk"]],"a":"D","e":"A goods received note is usually prepared by a member of staff in the stores department that takes receipt of the goods."},{"n":43,"q":"Who is most likely to record deliveries into stores?","c":[],"o":[["A","Stores clerk"],["B","Sales clerk"],["C","Accounts clerk"],["D","Personnel assistant"]],"a":"A","e":"Stores clerk."},{"n":44,"q":"Which of the following describes a purchase order?","c":[],"o":[["A","Issued by the purchasing department, sent to the supplier requesting materials."],["B","Issued by the stores department, sent to the purchasing department requesting materials."],["C","Received together with the materials and compared to the materials received."],["D","Issued by the production department, sent to the stores department requesting materials."]],"a":"A","e":"Option B describes a purchase requisition note. Option C describes a delivery note. Option D describes a material requisition note."}]},{"name":"Cost Classification and Measurement","qs":[{"n":45,"q":"Which costs are included within a prime cost?","c":[],"o":[["A","All variable costs"],["B","Direct labour and material only"],["C","Direct labour, direct material and direct expense"],["D","Direct labour, direct material and production overhead"]],"a":"C","e":"Prime cost is defined as the total direct production cost of an item. This consists of direct material and direct labour cost, plus any direct expenses."},{"n":46,"q":"Which of the following statements best describes a semi-variable cost?","c":[],"o":[["A","A cost that increases in direct proportion to output"],["B","A cost that remains constant irrespective of the level of output"],["C","A cost that contains an element of both fixed and variable cost"],["D","A cost that increases throughout the year"]],"a":"C","e":"This is a simple definition of a semi-fixed (or semi-variable) cost."},{"n":47,"q":"Which of the costs listed below is not a fixed cost?","c":[],"o":[["A","Insurance"],["B","Business rates"],["C","Depreciation - based on straight-line method"],["D","Materials used in production"]],"a":"D","e":"Material costs vary with the volume of production."},{"n":48,"q":"Which costs are included within production overheads?","c":[],"o":[["A","Variable overheads only"],["B","Indirect labour, indirect material and indirect expenses related to production activity"],["C","Indirect expenses only"],["D","Indirect labour and material related to the production activity"]],"a":"B","e":"An overhead cost is an indirect cost. Overheads include indirect materials costs, indirect labour costs and indirect expenses."},{"n":49,"q":"Which of the following statements best describes a direct cost?","c":[],"o":[["A","A cost which cannot be influenced by its budget holder"],["B","Expenditure which can be economically identified with a specific cost unit"],["C","A cost which needs to be apportioned to a cost centre"],["D","The highest proportion of the total cost of a product"]],"a":"B","e":"A direct cost is a cost that can be traced directly to a unit of production or sale, or another cost unit."},{"n":50,"q":"What would be the most appropriate cost unit for a cake manufacturer?","c":[],"o":[["A","Cake"],["B","Batch"],["C","Kilogram"],["D","Production run"]],"a":"B","e":"It would be appropriate to use the costs for a batch of cakes, since the cost for an individual cake might be too small."},{"n":51,"q":"A factory makes wooden chairs. Which of the following items would be most likely to behave as stepped costs?","c":[],"o":[["A","Wood used to make chairs"],["B","Factory supervisors' salaries"],["C","Heating and light costs"],["D","Staples to fix the fabric to the seat of the chair"]],"a":"B","e":"Supervisors' salaries are most likely to behave as stepped costs because, as activity levels increase, more workers will be needed and therefore the number of supervisors will increase also."},{"n":52,"q":"The following graph represents which type of cost?","c":[{"t":"i","x":"(Graph showing a straight line starting at origin and sloping upwards)"}],"o":[["A","Fixed cost"],["B","Variable cost"],["C","Semi-variable cost"],["D","Stepped cost"]],"a":"B","e":"A would be a line parallel with the base line showing units. B would be a line commencing at '0' and would show a linear pattern. C would be linear but would start some way up the y axis. D would show a stepped effect."},{"n":53,"q":"For operational purposes, for a company operating a fleet of delivery vehicles, which of the following methods of calculating cost would be most useful?","c":[],"o":[["A","Cost per mile run"],["B","Cost per driver hour"],["C","Cost per tonne mile"],["D","Cost per kilogram carried"]],"a":"C","e":"Revenue is most likely to be based on the quantity delivered and the distance travelled. Cost per tonne mile gives a measure of both quantity and distance."},{"n":54,"q":"The following data relate to the overhead expenditure of contract cleaners at two activity levels:","c":[{"t":"table","h":["Square metres cleaned","Overheads"],"r":[["12,750","$73,950"],["15,100","$83,585"]]},{"t":"p","x":"If fixed overheads are estimated to cost $21,675, what is the estimated overhead cost if 16,200 square metres are to be cleaned?"}],"o":[["A","$66,420"],["B","$88,095"],["C","$89,674"],["D","$93,960"]],"a":"B","e":"Variable overhead cost per square metre = $61,910 / 15,100 = $4.10. Estimated overhead costs for 16,200 square metres: Variable cost (16,200 × $4.10) = $66,420 + Fixed overheads $21,675 = $88,095."},{"n":55,"q":"The following data relate to two output levels of a department:","c":[{"t":"table","h":["Machine hours","Overheads"],"r":[["17,000","$246,500"],["18,500","$251,750"]]},{"t":"p","x":"What is the amount of fixed overheads?"}],"o":[["A","$5,250"],["B","$59,500"],["C","$187,000"],["D","$246,500"]],"a":"C","e":"Variable cost of 1,500 hours = $5,250. Variable overhead rate per hour = $3.50. Fixed cost = $246,500 - (17,000 × $3.50) = $246,500 - $59,500 = $187,000."},{"n":56,"q":"Which of the following is a direct expense?","c":[],"o":[["A","Materials used on production"],["B","Special tools for job 721"],["C","Power"],["D","Depreciation"]],"a":"B","e":"Power costs and depreciation charges are overhead costs. Materials used in production are a direct material cost. Costs incurred obtaining special tools for a specific job are a direct expense of that job."},{"n":57,"q":"Hockey Skill manufactures hockey sticks. A summary of some cost headings include:","c":[{"t":"p","x":"(a) wood used as raw material"},{"t":"p","x":"(b) rubber covers for handles"},{"t":"p","x":"(c) depreciation"},{"t":"p","x":"(d) power"},{"t":"p","x":"(e) sales manager's salary"},{"t":"p","x":"(f) labour in assembly department"},{"t":"p","x":"(g) oils and greases"},{"t":"p","x":"(h) telephone and postage"},{"t":"p","x":"(i) insurance of plant"},{"t":"p","x":"(j) supervisory labour."},{"t":"p","x":"Which of the above items would be classified as production overheads?"}],"o":[["A","(a), (f), (d) and (e)"],["B","(c), (d), (g), (i) and (j)"],["C","(e), (h), (i) and (j)"],["D","(a), (b), (c), (d) and (f)"]],"a":"B","e":"Items (a) and (b) are direct material costs. Item (e) is a selling overhead cost. Item (f) is a direct labour cost. Item (h) is likely to be treated as an administration overhead."},{"n":58,"q":"A small engineering company that makes generators specifically to customers' own designs has had to purchase some special tools for a particular job. The tools will have no further use after the work has been completed and will be scrapped. How should the cost of these tools be treated?","c":[],"o":[["A","Variable production overheads"],["B","Fixed production overheads"],["C","Indirect expenses"],["D","Direct expenses"]],"a":"D","e":"A, B and C all relate to overhead cost, not 'direct expense'."},{"n":59,"q":"Which of the following statements best describes a cost centre?","c":[],"o":[["A","A unit of product or service for which costs are calculated"],["B","An amount of profit attributable to an activity"],["C","A function or location within an organisation for which costs are accumulated"],["D","A section of the organisation for which budgets are prepared and control is exercised"]],"a":"C","e":"Answer C is the best definition of a cost centre. Answer A defines a cost unit. A cost centre is used to measure costs, but not revenues and profit."},{"n":60,"q":"For which of the following types of business unit would residual income be a suitable measure of performance?","c":[],"o":[["A","Cost centre"],["B","Revenue centre"],["C","Profit centre"],["D","Investment centre"]],"a":"D","e":"Investment centre performance should be measured by taking into account both the profit earned and the amount of capital invested in the centre. Residual income is profit less a notional charge for interest on capital employed."},{"n":61,"q":"Which of the following is a service cost centre in a manufacturing company?","c":[],"o":[["A","Finishing"],["B","Machining"],["C","Despatch"],["D","Assembly"]],"a":"C","e":"Machining, finishing and assembly are all departments involved directly in the production of manufactured items. Despatch is a part of sales and distribution activities."},{"n":62,"q":"A transport company has a cost accounting system for measuring the costs of the services it provides. The company provides train services throughout the southern region of the country. Which of the following would be the most appropriate cost unit for measuring operating costs, in a way that costs of its various services can be usefully compared?","c":[],"o":[["A","Cost per train"],["B","Cost per journey"],["C","Cost per passenger"],["D","Cost per passenger/kilometre"]],"a":"D","e":"Although costs can be measured for each train in service, each train journey and for each passenger carried, it is more useful for comparative purposes to measure the average cost of carrying passengers a given distance."},{"n":63,"q":"A training company runs courses for students that vary in length between one day and four weeks. The size of classes varies between 5 students and 40 students. The company wants to set a price for its courses based on a mark-up on cost. What would be the most appropriate basis for measuring costs?","c":[],"o":[["A","Cost per student per day"],["B","Cost per course"],["C","Cost per student"],["D","Cost per day"]],"a":"A","e":"Courses vary in length and student numbers vary between courses. A suitable measure of cost would be the cost for one student for each day of training."},{"n":64,"q":"A law firm provides a range of services to clients, who are a mixture of business, government and private clients. It has offices in three cities in different parts of the country. The firm's senior partners are reviewing the range of services the firm provides, with a view to specialising more in the future. How might the firm best analyse its profitability for this purpose?","c":[],"o":[["A","Profitability of each office"],["B","Profitability of each type of service provided"],["C","Profitability of each type of client"],["D","Profitability of each employee"]],"a":"B","e":"If the decision under review is whether to specialise in particular services, the most relevant information is the profitability for each type of service."},{"n":65,"q":"Which of the following statements is correct about costs in a manufacturing business?","c":[],"o":[["A","The fixed cost per unit is the same at all levels of output"],["B","The fixed cost per unit falls as output increases, at a constant rate"],["C","The fixed cost per unit falls as output increases, at a declining rate"],["D","The fixed cost per unit falls as output increases, at an increasing rate"]],"a":"C","e":"The fixed cost per unit is falling as output increases, but at a declining rate."},{"n":66,"q":"Which of the following is most likely to be treated as an indirect cost by a house builder?","c":[],"o":[["A","Nails and screws"],["B","Windows"],["C","Bricks"],["D","Electricity cables"]],"a":"A","e":"Material items with a low unit cost, such as nails and screws, are treated as indirect materials costs. This is because the time and effort required to measure low-cost items as direct costs is not worth the benefits obtained."},{"n":67,"q":"A travel company offers holidays to a range of destinations, which it advertises in a single brochure. Customers are transported to their destination in flights booked by the company for its exclusive use. Within each holiday destination, the company offers accommodation at different hotels, ranging from two-star to five-star hotels. The company measures the profitability of holidays to each hotel at each destination. Which of the following would be the direct costs of a holiday at the Hotel Splendide in Trinidad?","c":[{"t":"p","x":"(i) Brochure production and printing costs"},{"t":"p","x":"(ii) Air charter flight costs"},{"t":"p","x":"(iii) Hotel accommodation costs"}],"o":[["A","(i) and (ii) only"],["B","(i) and (iii) only"],["C","(ii) and (iii) only"],["D","(iii) only"]],"a":"D","e":"The brochure costs are a common cost for all holidays to all destinations. Air charter flight costs are a common cost for customers going to different hotels at the same destination. The only costs directly attributable to specific hotels are the hotel accommodation charges."},{"n":68,"q":"What is the full production cost per unit of a manufactured product?","c":[],"o":[["A","Direct material cost plus direct labour cost per unit"],["B","Prime cost plus production overhead cost per unit"],["C","Prime cost plus variable production overhead per unit"],["D","Production overhead cost per unit"]],"a":"B","e":"The full cost of a unit is its direct cost (prime cost) plus a share of overhead costs (variable and fixed overhead)."},{"n":69,"q":"Which one of the following statements is true?","c":[],"o":[["A","Heating costs are a variable cost because they differ according to the season of the year."],["B","A semi-variable cost is fixed for a certain level of activity and then changes to a new fixed level."],["C","The fixed cost per unit of output decreases as output increases."],["D","Total variable costs are constant at all levels of output."]],"a":"C","e":"Total fixed costs stay the same as output changes but fixed costs per unit fall. Heating cost is a fixed cost because it does not vary with the number of units of production."},{"n":70,"q":"The following costs are recorded for different levels of production:","c":[{"t":"table","h":["Period","Costs","Units of production"],"r":[["1","$1,400","200"],["2","$1,600","300"],["3","$1,600","400"]]},{"t":"p","x":"This cost could be classified as:"}],"o":[["A","fixed"],["B","variable"],["C","semi-variable"],["D","stepped"]],"a":"D","e":"The cost does not change for 300 and 400 units, therefore it cannot be variable or semi-variable. It changes between 200 and 300 units, so it cannot be a totally fixed cost. It must be a stepped cost."},{"n":71,"q":"Which of the following costs would be classified as an indirect cost?","c":[],"o":[["A","Flour for baking bread"],["B","Invoice for icing a wedding cake"],["C","Wages cost of baker"],["D","Depreciation of ovens"]],"a":"D","e":"Items A, B and C can be allocated to the cost of a job or batch. Depreciation would not generally be allocated to a job or batch and is an indirect cost."},{"n":72,"q":"The following charts demonstrate various costs in relation to activity:","c":[{"t":"i","x":"(Chart 1: Horizontal line; Chart 2: Upward sloping line from origin; Chart 3: Downward sloping line; Chart 4: Curve decreasing at a declining rate)"},{"t":"p","x":"Which of the above charts represents variable cost per unit?"}],"o":[["A","Chart 1"],["B","Chart 2"],["C","Chart 3"],["D","Chart 4"]],"a":"A","e":"Variable cost per unit is constant. Chart 2 is total variable cost."},{"n":73,"q":"Which one of the following departments is not a service cost centre in a manufacturing company?","c":[],"o":[["A","Accounting"],["B","Assembly"],["C","Maintenance"],["D","Personnel"]],"a":"B","e":"Assembly is a direct production operation and so the assembly department is a production cost centre, not a service cost centre."},{"n":74,"q":"A company operates a retail supermarket chain selling a range of grocery and household products. It has branches throughout the country and is reviewing the range of goods to be stocked in each of these branches. How might the company best analyse its profitability for this purpose?","c":[],"o":[["A","By area of the country"],["B","By contract with each supplier"],["C","By customer payment method"],["D","By product line stocked"]],"a":"D","e":"The company is 'reviewing the range of goods to be stocked' in its branches. Its best method of analysing profitability is therefore by product or product line."},{"n":75,"q":"A company produces electronic circuit boards. Each circuit board has a raw material input of $60 and labour input that costs $20. The company intends to produce 1,000 circuit boards per week. The company must also pay the rent of the factory totalling $20,000 per annum, business rates of $4,000 per annum and the production director's salary of $24,000 per annum. What is the fixed cost of the business?","c":[],"o":[["A","$20,000"],["B","$24,000"],["C","$48,000"],["D","$80,000"]],"a":"C","e":"Rent, rates and the production director's salary would all be classified as fixed costs. $20,000 + $4,000 + $24,000 = $48,000."},{"n":76,"q":"A large hotel has coffee shops, restaurants and banqueting. They are used by hotel residents and outside users. The manager of the hotel is responsible for encouraging residents to use the hotel's catering facilities. Which report will show how effective the manager has been in achieving this objective?","c":[],"o":[["A","A report analysing the utilisation of hotel catering services per room occupied"],["B","A report showing the amount of money spent in the hotel's catering facilities"],["C","A report showing the number of residents in the hotel at any given time"],["D","A report showing the occupancy of the various catering facilities"]],"a":"A","e":"Reports B and D would not distinguish between hotel residents and outside users of the facilities. Only Report A analyses the usage of the catering facilities by the hotel residents."},{"n":77,"q":"Which description best fits the cost curve below?","c":[{"t":"i","x":"(Graph showing a curve that starts high on the y-axis and decreases, flattening out as activity increases)"}],"o":[["A","Direct labour cost per unit"],["B","Direct material cost per unit"],["C","Fixed production cost per unit"],["D","Variable production cost per unit"]],"a":"C","e":"Items A, B and D would normally be drawn on a graph as a line parallel to the x axis. The fixed cost per unit falls as the volume of output rises, and not in a straight line."},{"n":78,"q":"Which one of the following items is most likely to be treated as an indirect cost by a furniture manufacturer?","c":[],"o":[["A","Fabric to cover the seat of a chair"],["B","Metal used for the legs of a chair"],["C","Staples to fit the fabric to the seat of a chair"],["D","Wood used to make the frame of a chair"]],"a":"C","e":"It is usual to treat large volume low-unit-cost items as indirect materials, and so as an indirect material cost. Examples include staples, nails, small pins, screws."},{"n":79,"q":"The Rendez-Vous is a hotel, the following are either cost centres or cost units for a hotel:","c":[{"t":"p","x":"(a) Bar"},{"t":"p","x":"(b) Restaurant"},{"t":"p","x":"(c) Room/night"},{"t":"p","x":"(d) Meal served"},{"t":"p","x":"(e) Conference delegate"},{"t":"p","x":"(f) Fitness suite"},{"t":"p","x":"(g) Conference room"},{"t":"p","x":"Which of the above items would be classified as cost units?"}],"o":[["A","(a), (c), (d) and (f)"],["B","(b), (d) and (g)"],["C","(e), (f) and (g)"],["D","(c), (d) and (e)"]],"a":"D","e":"A cost unit is a unit of output, for a hotel the output can be in the form of one night stay in a room (room/night), a meal served in the restaurant or a conference delegate in the conference room."},{"n":80,"q":"Please identify the following as either cost centres or cost units for a house building company:","c":[{"t":"p","x":"(i) Quantity surveying"},{"t":"p","x":"(ii) Planning"},{"t":"p","x":"(iii) Bungalow"},{"t":"p","x":"(iv) Town House"},{"t":"p","x":"(v) Design"},{"t":"p","x":"(vi) Sales"},{"t":"p","x":"(vii) Detached House"}],"o":[["A","Cost centre: (ii), (iii) and (iv); Cost unit: (i), (v), (vi) and (vii)"],["B","Cost centre: (i), (ii), (v) and (vi); Cost unit: (iii), (iv) and (vii)"],["C","Cost centre: (i), (iii) and (vii); Cost unit: (ii), (iv), (v) and (vi)"],["D","Cost centre: (v), (vi) and (vii); Cost unit: (i), (ii), (iii) and (iv)"]],"a":"B","e":"Quantity surveying, planning, design & sales are all departments within a house building company which would incur costs & bungalows, town houses & detached houses are units of the product they sell."},{"n":81,"q":"When preparing an operating statement based on marginal costing principles, inventory valuation comprises which of the following costs?","c":[],"o":[["A","Direct labour and material only"],["B","Prime cost plus production overhead"],["C","Prime cost plus variable production overhead"],["D","Total cost of sales"]],"a":"C","e":"Inventory is valued at marginal production cost, which is the prime cost plus any variable production overhead."}]},{"name":"Cost Accounting","qs":[{"n":82,"q":"RCW operates a bonus scheme based on time saved against a predetermined time allowance for actual output. Employees are typically expected to produce 700 units a week. The standard allowance is 20 units of 'R' per hour. In Week 6, an operative produced 750 units of 'R' in 32 hours. What is the time saved by this employee in Week 6 on 'R' production?","c":[],"o":[["A","2.50"],["B","3.00"],["C","5.50"],["D","5.90"]],"a":"C","e":"Standard time for 750 units = 750 / 20 = 37.5 hours. Time taken = 32 hours. Time saved = 37.5 - 32 = 5.5 hours."},{"n":83,"q":"Gross wages incurred in a cost centre for the month of January totalled $45,250 as follows:","c":[{"t":"table","h":null,"r":[["Ordinary time - direct employees","$27,500"],["Overtime - indirect employees","$6,500"],["Special conditions allowance - basic premium","$4,500"],["Shift allowance - indirect employees","$1,300"],["Sick pay - direct employees","$450"],["Overtime - direct employees","$750"]]},{"t":"p","x":"The overtime is a regular feature. What is the correct figure for direct wages for January?"}],"o":[["A","$31,550"],["B","$32,800"],["C","$35,300"],["D","$32,000"]],"a":"D","e":"Unless overtime is worked specifically at the request of a particular customer, the cost of any overtime premium is treated as a general production overhead cost. The only direct labour cost is the cost of the hours worked, valued at the basic rate of pay per hour. Here, this cost is $27,500 + $4,500 = $32,000."},{"n":84,"q":"HH operates an incentive scheme based on differential piecework. Employees are paid on the following basis:","c":[{"t":"p","x":"Weekly output up to: 600 units - $0.40 per unit"},{"t":"p","x":"601-650 units - $0.50 per unit"},{"t":"p","x":"650 units+ - $0.75 per unit"},{"t":"p","x":"This is paid only upon production meeting quality standards with only the additional units qualifying for the higher rates. In Week 17, an employee produced 670 units, of which 10 were rejected. What would the gross pay for the week be?"}],"o":[["A","$272.50"],["B","$280.00"],["C","$330.00"],["D","$495.00"]],"a":"A","e":"600 units at $0.40 = $240.00; 50 units at $0.50 = $25.00; 10 units at $0.75 = $7.50. Total for 660 units = $272.50."},{"n":85,"q":"Which of the following methods of remuneration is NOT an incentive-based scheme?","c":[],"o":[["A","Straight piecework"],["B","High day rate"],["C","Group bonus"],["D","Differential piecework"]],"a":"B","e":"Piecework is an incentive-based pay scheme, because employees are paid more for producing more. A high day rate scheme, in which employees receive a high basic rate of pay, does not offer an incentive to be more productive."},{"n":86,"q":"Which of the following relates to the cost of replacing (rather than retaining) labour due to high employee turnover?","c":[],"o":[["A","Improving working conditions"],["B","Suffering the learning curve effect"],["C","Provision of a pension"],["D","Provision of welfare services"]],"a":"B","e":"Working conditions, pension provisions and welfare are all costs associated with retaining labour, not replacing labour."},{"n":87,"q":"A job requires 2,400 actual labour hours for completion and it is anticipated that there will be 20% idle time. If the wage rate is $10 per hour, what is the budgeted labour cost for the job?","c":[],"o":[["A","$19,200"],["B","$24,000"],["C","$28,800"],["D","$30,000"]],"a":"D","e":"Paid hours including idle time = 2,400 × 100 / 80 = 3,000. Budgeted labour cost = 3,000 hours × $10 = $30,000."},{"n":88,"q":"A job is budgeted to require 3,300 productive hours after incurring 25% idle time. If the total labour cost budgeted for the job is $36,300, what is the labour cost per hour?","c":[],"o":[["A","$8.25"],["B","$8.80"],["C","$11.00"],["D","$13.75"]],"a":"A","e":"Productive hours = 3,300. Idle time = 3,300 × 25/(100-25) = 1,100. Total paid hours = 4,400. Total labour cost = $36,300. Labour rate per hour = $36,300 / 4,400 = $8.25."},{"n":89,"q":"Which one of the following would be classified as direct labour?","c":[],"o":[["A","Personnel manager in a company servicing cars"],["B","Bricklayer in a construction company"],["C","General manager in a DIY shop"],["D","Maintenance manager in a company producing cameras"]],"a":"B","e":"Managers are not usually classified as direct labour."},{"n":90,"q":"Employee A is a carpenter and normally works 36 hours per week. The standard rate of pay is $3.60 per hour. A premium of 50% of the basic hourly rate is paid for all overtime hours worked. During the last week of October 2001, Employee A worked for 42 hours. The overtime hours worked were for the following reasons:","c":[{"t":"p","x":"Machine breakdown: 4 hours"},{"t":"p","x":"To complete a special job at the request of the customer: 2 hours"},{"t":"p","x":"How much of Employee A's earnings for the last week of October would have been treated as direct wages?"}],"o":[["A","$162.00"],["B","$129.60"],["C","$140.40"],["D","$151.20"]],"a":"C","e":"Idle time is an overhead cost. When overtime is worked specifically for a customer, the overtime premium is treated as a direct cost of the job. 42 hours less 4 hours idle time = 38 hours. 38 hours at basic rate of pay ($3.60) = $136.80. Overtime premium for 2 hours (× 50% of $3.60) = $3.60. Total direct wages cost = $140.40."},{"n":91,"q":"An employee is paid on a piecework basis. The basis of the piecework scheme is as follows:","c":[{"t":"p","x":"1 to 100 units - $0.40 per unit"},{"t":"p","x":"101 to 200 units - $0.50 per unit"},{"t":"p","x":"201 to 299 units - $0.60 per unit"},{"t":"p","x":"with only the additional units qualifying for the higher rates. Rejected units do not qualify for payment. During a particular day the employee produced 240 units of which 8 were rejected as faulty. What did the employee earn for the day's work?"}],"o":[["A","$109.20"],["B","$114.00"],["C","$139.20"],["D","$144.00"]],"a":"A","e":"Good output = 240 - 8 = 232 units. 100 units at $0.40 = $40.00; 100 units at $0.50 = $50.00; 32 units at $0.60 = $19.20. Total = $109.20."},{"n":92,"q":"Which of the following is usually classed as a step cost?","c":[],"o":[["A","Supervisor's wages"],["B","Raw materials"],["C","Rates"],["D","Telephone"]],"a":"A","e":"Supervisor's wages are usually classified as a step cost because a supervisor may be responsible for supervising up to a specific number of workers."},{"n":93,"q":"Which of the following would be most likely to provide Information on contracted rates of pay?","c":[],"o":[["A","a trade union"],["B","a production manager"],["C","a personnel manager"],["D","a work study manager"]],"a":"C","e":"Information on contracted rates of pay should be provided to the accounts office by the Human Resources (personnel) department."},{"n":94,"q":"Which of the following statements is correct?","c":[],"o":[["A","Idle time cannot be controlled because it is always due to external factors"],["B","Idle time is always controllable because it is due to internal factors"],["C","Idle time is always due to inefficient production staff"],["D","Idle time is not always the fault of production staff"]],"a":"D","e":"A: idle time is partially controllable. B: not all internal factors are controllable. C cannot be production staff's responsibility."},{"n":95,"q":"A company operates a piecework scheme to pay its staff. The staff receive $0.20 for each unit produced. However the company guarantees that every member of staff receive at least $15 per day. Shown below is the number of units produced by Operator A during a recent week:","c":[{"t":"table","h":["Day","Units produced"],"r":[["Monday","90"],["Tuesday","70"],["Wednesday","75"],["Thursday","60"],["Friday","90"]]},{"t":"p","x":"What are Operator A's earnings for the week?"}],"o":[["A","$75.00"],["B","$77.00"],["C","$81.00"],["D","$152.00"]],"a":"C","e":"Monday 90 × $0.2 = $18; Tuesday 70 × $0.2 = $14 but minimum $15; Wednesday 75 × $0.2 = $15; Thursday 60 × $0.2 = $12 but minimum $15; Friday 90 × $0.2 = $18. Total = $18 + $15 + $15 + $15 + $18 = $81."},{"n":96,"q":"Which of the following statements best describes overhead allocation?","c":[],"o":[["A","The charging of overhead to cost units"],["B","The allotment of proportions of items of cost to cost centres or cost units"],["C","The charging of direct material to jobs"],["D","The allotment of whole items of indirect cost to cost centres"]],"a":"D","e":"This is a basic definition of overhead allocation."},{"n":97,"q":"A method of dealing with overheads involves spreading common costs over cost centres on the basis of benefit received. What is this method known as?","c":[],"o":[["A","Overhead absorption"],["B","Overhead apportionment"],["C","Overhead allocation"],["D","Overhead analysis"]],"a":"B","e":"A method of dealing with overheads which involves spreading common costs over cost centres on the basis of benefit received is known as overhead apportionment."},{"n":98,"q":"Production supervisory salaries are classed as production overhead. Which is the most appropriate basis of apportioning this cost to cost centres?","c":[],"o":[["A","Number of units produced"],["B","Machine hours"],["C","Direct labour hours"],["D","Number of machines"]],"a":"C","e":"A supervisor's time is more likely to be spent on supervising employees in proportion to the direct labour hours worked."},{"n":99,"q":"Which of the following would be the most appropriate basis for apportioning machinery insurance costs to cost centres within a factory?","c":[],"o":[["A","The number of machines in each cost centre"],["B","The floor area occupied by the machinery in each cost centre"],["C","The value of the machinery in each cost centre"],["D","The operating hours of the machinery in each cost centre"]],"a":"C","e":"Insurance costs for machinery are probably best apportioned in relation to the value of the machinery."},{"n":100,"q":"Factory overheads can be absorbed by which of the following methods?","c":[{"t":"p","x":"1. Direct labour hours"},{"t":"p","x":"2. Machine hours"},{"t":"p","x":"3. Indirect labour hours"},{"t":"p","x":"4. $x per unit"}],"o":[["A","1, 2, 3 or 4"],["B","1 and 2 only"],["C","1, 2 or 4 only"],["D","2, 3 or 4 only"]],"a":"C","e":"Production overheads can be absorbed by any of the methods listed, except for indirect labour hours as, by definition, they do not have a strong correlation with output."},{"n":101,"q":"A business employs two grades of labour in its production department. Grade A workers are considered direct labour employees, and are paid $10 per hour. Grade B workers are considered indirect labour employees, and are paid $6 per hour. In the week just ended, Grade A labour worked 30 hours of overtime, 10 hours on a specific customer order at the customer's request, and the other 20 hours as general overtime. Grade B labour worked 45 hours of overtime, as general overtime. Overtime is paid at time-and-one-half. What would be the total amount of pay for overtime worked in the week that is considered to be a direct labour cost?","c":[],"o":[["A","$50"],["B","$150"],["C","$285"],["D","$350"]],"a":"D","e":"Cost of basic pay, Grade A labour (30 × $10) = $300. Cost of overtime premium for hours on specific order (10 × 50% of $10) = $50. Total direct labour cost = $350."},{"n":102,"q":"A manufacturing business is currently extremely busy and overtime is being worked. How would the cost of the overtime premium payable to direct labour employees normally be treated?","c":[],"o":[["A","a direct cost"],["B","a production overhead cost"],["C","an administration overhead cost"],["D","a prime cost"]],"a":"B","e":"Although the basic hourly wage of direct labour employees is treated as a direct cost, even when the work is done in overtime, the cost of any overtime premium is usually treated as a production overhead cost."},{"n":103,"q":"Which one of the following would be classed as indirect labour?","c":[],"o":[["A","Assembly workers in a firm that manufactures digital video recorders"],["B","A stores assistant in a factory stores"],["C","A plasterer in a building construction firm"],["D","An audit clerk in a firm of auditors"]],"a":"B","e":"Employees in a stores department in a factory are indirect workers and their labour costs are treated as a production overhead cost."},{"n":104,"q":"What is cost apportionment?","c":[],"o":[["A","Charging discrete, identifiable items of cost to cost centres or cost units."],["B","The collection of costs attributable to cost centres and cost units using the costing methods applied by the business."],["C","The process of establishing the costs of cost centres or cost units."],["D","The division of a cost between two or more cost centres in proportion to the estimated benefit received by each centre."]],"a":"D","e":"Apportionment means sharing out. With cost apportionment, a cost is shared out between two or more cost centres on a fair basis."},{"n":105,"q":"A manufacturer employs two grades of labour in its machining department, grade A and grade B. Grade A employees are treated as direct labour employees and grade B employees are treated as indirect labour employees. Grade A employees are paid $8 per hour and grade B workers receive $6 per hour. The basic working week is 40 hours. Overtime is paid at time +50% to all employees in the department. There are 10 grade A employees and 6 grade B employees. During a particular week, each grade A employee worked for 45 hours and each grade B employee worked for 43 hours. The overtime was necessary due to staff sickness. What will be the charge to production overhead for the week?","c":[],"o":[["A","$54"],["B","$254"],["C","$1,602"],["D","$1,802"]],"a":"D","e":"Grade B labour: Basic wages (6 × 43 hours × $6) = $1,548; Overtime premium (6 × 3 hours × $3) = $54. Grade A labour: Overtime premium (10 × 5 hours × 50% × $8) = $200. Total = $1,802."},{"n":106,"q":"The payroll department has produced the following information for the month about the pay for employees in department X.","c":[{"t":"table","h":["Department X","$"],"r":[["Payments to employees","7,500"],["Income tax","2,500"],["Employees' state benefit contributions (NI in the UK)","1,200"],["Employer's state benefit contributions (NI in the UK)","2,000"]]},{"t":"p","x":"What are the gross wages for the department for the month?"}],"o":[["A","$7,500"],["B","$10,000"],["C","$11,200"],["D","$13,200"]],"a":"C","e":"Gross wages = Payments to employees + Income tax + Employees' state benefit contributions = $7,500 + $2,500 + $1,200 = $11,200."},{"n":107,"q":"The payroll department has produced the following information for the month about the pay for employees in department Z. Department Z is a part of the accounts division.","c":[{"t":"table","h":["Department Z","$"],"r":[["Salaries (gross wages)","23,000"],["Income tax","4,500"],["Employees' state benefit contributions (NI in the UK)","2,400"],["Employer's state benefit contributions (NI in the UK)","3,500"]]},{"t":"p","x":"What is the labour cost in Department Z that would be treated as administration overhead cost for the month?"}],"o":[["A","$23,000"],["B","$26,500"],["C","$29,900"],["D","$33,400"]],"a":"B","e":"The total labour cost to the business is the cost of the salaries (gross earnings) plus the employer's state benefit contributions. $23,000 + $3,500 = $26,500."},{"n":108,"q":"An employee is paid on a stepped piecework basis, as follows:","c":[{"t":"table","h":["Units produced each week","$"],"r":[["1-200","0.60 per unit"],["201-300","0.80 per unit"],["Over 301","1.00 per unit"]]},{"t":"p","x":"Only the additional units qualify for the higher rates. Rejected units do not qualify for any payment. During a particular week, the employee makes 380 units, of which 35 were rejected as faulty. What were his gross earnings for the week?"}],"o":[["A","$245"],["B","$280"],["C","$345"],["D","$380"]],"a":"A","e":"Good units produced = 380 - 35 = 345 units. First 200 units at $0.60 = $120; Next 100 units at $0.80 = $80; Next 45 units at $1.00 = $45. Gross earnings = $245."},{"n":109,"q":"What would be the appropriate basis for apportioning the costs of heating and lighting between cost centres in a factory building?","c":[],"o":[["A","Number of employees"],["B","Number of machines"],["C","Value of machinery"],["D","Floor area occupied by each department"]],"a":"D","e":"Heating and lighting costs are probably related more to the area taken up by each department."},{"n":110,"q":"What would be the appropriate basis for apportioning the factory manager's salary between cost centres in a factory building?","c":[],"o":[["A","Number of employees"],["B","Number of machines"],["C","Value of machinery"],["D","Floor area occupied by each department"]],"a":"A","e":"Management time spent dealing with each department is probably related to either the number of employees in each department or the hours worked in each department."},{"n":111,"q":"A business maintains an inventory control database. For each item of inventory, the file contains the quantity of free inventory for the item. For inventory item 245711, the current quantity held by the business is 400 units. The stores department has received requisitions from user departments for 320 units, which have yet to be processed and dealt with. An order for a new supply of 350 units has been placed with the supplier, and delivery is expected in one or two days. What is the quantity of free inventory for this item?","c":[],"o":[["A","30"],["B","370"],["C","400"],["D","430"]],"a":"D","e":"Free inventory = quantity in inventory + quantities on order - quantities requisitioned = 400 - 320 + 350 = 430."},{"n":112,"q":"A company employs 20 direct production operatives and 10 indirect staff in its manufacturing department. The normal operating hours for all employees is 38 hours per week and all staff are paid a basic rate of $5 per hour. Overtime hours are paid at the basic rate + 50%. During a particular week all employees worked for 44 hours to meet the company's general production requirements. What amount would be charged to production overhead?","c":[],"o":[["A","$300"],["B","$450"],["C","$2,350"],["D","$2,650"]],"a":"D","e":"Direct operatives: basic pay (20 × 44 × $5) = $4,400. Direct operatives: overtime premium (20 × 6 × 50% of $5) = $300. Indirect staff: basic pay (10 × 44 × $5) = $2,200. Indirect staff: overtime premium (10 × 6 × 50% of $5) = $150. Total production overhead = $300 + $2,200 + $150 = $2,650."},{"n":113,"q":"With which costs is absorption costing concerned?","c":[],"o":[["A","Direct labour costs only"],["B","Direct material costs only"],["C","Fixed costs only"],["D","Variable and fixed costs"]],"a":"D","e":"A fully absorbed cost consists of direct costs (usually variable costs) plus fixed and variable overheads."},{"n":114,"q":"Aspects of payroll include:","c":[{"t":"p","x":"1. Employer's state benefit contribution (National Insurance in the UK)"},{"t":"p","x":"2. Employee's state benefit contribution (National Insurance in the UK)"},{"t":"p","x":"3. Income tax (PAYE in the UK)"},{"t":"p","x":"4. Salaries"},{"t":"p","x":"Which of the above are costs to an employer?"}],"o":[["A","1 and 4 only"],["B","2 and 4 only"],["C","2, 3 and 4 only"],["D","1, 2, 3 and 4"]],"a":"A","e":"The costs of payroll to the employer are the gross wages and salaries plus the employer's state benefit contribution. Income tax and employees' state benefit contributions are deductions out of gross wages and salaries."},{"n":115,"q":"An employee is paid on a piecework basis. The scheme is as follows:","c":[{"t":"p","x":"1-100 units per day - $0.20 per unit"},{"t":"p","x":"101-200 units per day - $0.30 per unit"},{"t":"p","x":"> 200 units per day - $0.40 per unit"},{"t":"p","x":"Only the additional units qualify for the higher rates. Rejected units do not qualify for payment. An employee produced 210 units in a day of which 17 were rejected as faulty. How much did the employee earn for the day?"}],"o":[["A","$47.90"],["B","$54.00"],["C","$57.90"],["D","$84.00"]],"a":"A","e":"Total production 210. Rejected items 17. Good output 193. Pay for the first 100 units (× $0.20) = $20.00. Pay for the next 93 units (× $0.30) = $27.90. Employee's total earnings = $47.90."},{"n":116,"q":"It is possible for an item of overhead expenditure to be shared amongst several cost centres. It is also possible that an item of overhead expenditure may relate to just one specific cost centre. What term is used to describe charging an item of overhead to just one specific cost centre?","c":[],"o":[["A","Absorption"],["B","Allocation"],["C","Apportionment"],["D","Re-apportionment"]],"a":"B","e":"The charging of an overhead expense item in full to a specific cost centre is called allocation."},{"n":117,"q":"What would be the most appropriate basis for apportioning machinery insurance costs to cost centres within a factory?","c":[],"o":[["A","Floor area occupied by the machinery"],["B","Number of machines"],["C","Operating hours of machinery"],["D","Value of machinery"]],"a":"D","e":"Insurance premiums for machinery are generally related to the value of the items insured."},{"n":118,"q":"There are 275 units of material BX in stock. An order for 650 units is expected and a material requisition for 300 units has not yet been issued to the production cost centre. What is the free inventory?","c":[],"o":[["A","275 units"],["B","625 units"],["C","650 units"],["D","675 units"]],"a":"B","e":"Free inventory = 275 + 650 - 300 = 625 units."},{"n":119,"q":"A company employs 30 direct production staff and 15 indirect staff in its manufacturing department. The normal operating hours for all employees is 37 hours per week and all staff are paid a basic rate of $8 per hour. Overtime hours are paid at the basic rate + 50%. During a particular week all employees worked for 42 hours to meet the company's general production requirements. What is the total direct labour cost?","c":[],"o":[["A","$8,880"],["B","$10,080"],["C","$10,680"],["D","$10,980"]],"a":"B","e":"The basic pay of direct workers is a direct cost. 30 × 42 × $8 = $10,080. Indirect labour cost and the overtime premium are indirect costs."},{"n":120,"q":"An employee is paid on a piecework basis. The scheme is as follows:","c":[{"t":"p","x":"1-200 units per day - $0.15 per unit"},{"t":"p","x":"201-500 units per day - $0.20 per unit"},{"t":"p","x":">500 units per day - $0.25 per unit"},{"t":"p","x":"Only the additional units qualify for the higher rates. Rejected units do not qualify for payment. An employee produced 512 units in a day of which 17 were rejected as faulty. What wage is paid to the employee?"}],"o":[["A","$128
